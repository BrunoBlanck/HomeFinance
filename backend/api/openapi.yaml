openapi: 3.1.0

info:
  title: HomeFinance API
  version: "1.0.0"
  summary: Autenticação, contas, categorias, lançamentos, importação e transferências
  description: |
    Contrato da API do HomeFinance. **Fonte de verdade** do que a API expõe
    (ADR-006). Nesta entrega os handlers são escritos à mão (ADR-011), e o
    teste `cmd/api/routes_test.go` garante que o conjunto de (método, caminho)
    daqui é exatamente o da tabela de rotas em `cmd/api/routes.go` — divergir
    quebra o build.

    Convenções:
      - JSON em `camelCase`; instantes em ISO 8601 UTC; **data civil**
        (`AAAA-MM-DD`) e **mês** (`AAAA-MM`) são tipos próprios, sem hora e sem
        fuso (ADR-019a).
      - Nome de campo vale na **caixa exata** declarada aqui, em todo corpo de
        requisição e em todo nível dele (emenda §13 da spec 0005): `CategoryId`
        ou `EMAIL` é 400, como qualquer campo fora do contrato. Um campo, um
        nome — vale também para o campo repetido no mesmo objeto, cujas
        ocorrências são todas conferidas.
      - Dinheiro **sempre** em centavos, `integer/int64`. Não existe `number` em
        campo monetário em lugar nenhum deste contrato: float em dinheiro é
        proibido em toda camada (ADR-003), e um `number` aqui seria a porta de
        entrada dele no frontend.
      - **Valor vazio em query ≡ chave ausente.** Em todo parâmetro de query
        **opcional** deste contrato, `?x=` (chave presente, valor vazio) vale
        exatamente o que a ausência da chave vale — e a URL **canônica** é
        sempre a sem a chave. Os `enum` dos parâmetros descrevem os valores que
        **selecionam** um recorte; o caso vazio é definido aqui, e não no
        schema, porque a passagem de valor vazio é declarada indefinida pela
        própria OpenAPI 3.1 (`allowEmptyValue` está deprecado). Parâmetro
        **obrigatório** não tem essa tolerância: `?month=` é 400, como a
        ausência. E valor vazio **não** afrouxa a regra de ocorrência única
        **onde ela é declarada no próprio parâmetro** ("Repetido é 400"): lá,
        `?x=a&x=` é 400 por chave repetida. Onde o parâmetro não a declara, a
        chave repetida ainda vence pela primeira ocorrência — dívida conhecida,
        com dono e gatilho em `docs/ROADMAP.md`, não garantia deste contrato.
      - Erro sempre no formato único do schema `Error`.
      - Sessão em cookies `HttpOnly; Secure; SameSite=Strict; Path=/`, com
        prefixo `__Host-` quando `COOKIE_SECURE=true` (ADR-013).

    **Respostas propositalmente indistinguíveis** (§3.12 da spec 0001): os
    endpoints de registro, reenvio, recuperação de senha, validação de código,
    login e refresh devolvem o mesmo status e o mesmo corpo para situações
    diferentes, de modo a não revelar se um e-mail está cadastrado.
  license:
    name: Proprietário

servers:
  - url: /api/v1
    description: Base de todos os caminhos

tags:
  - name: health
    description: Sondas de disponibilidade
  - name: auth
    description: Registro, verificação de e-mail, sessão e senha
  - name: me
    description: Dados da sessão atual
  - name: accounts
    description: Contas — onde o dinheiro está (spec 0003)
  - name: categories
    description: Categorias de receita e despesa, em dois níveis (spec 0003)
  - name: transactions
    description: Lançamentos — receita, despesa e as pernas de transferência (spec 0004)
  - name: card-statements
    description: Faturas de cartão, somente leitura (spec 0004, ADR-023)
  - name: imports
    description: Importação de extratos e faturas, em duas fases (spec 0004, ADR-024)
  - name: transfers
    description: Transferências entre as contas da casa, cada par uma vez (spec 0005, ADR-016/ADR-026)
  - name: investments
    description: Aportes e resgates do mês, marcados por natureza de categoria (spec 0006, ADR-029)
  - name: reports
    description: Relatórios do mês, somente leitura — o número é a fonte, o gráfico é o resumo (ADR-021, ADR-027)
  - name: dashboard
    description: O painel — o resumo do mês em um pedido só (spec 0008, ADR-031)
  - name: ai
    description: |
      Menu IA — exportar prompt e importar palavras-chave (spec 0010). O
      produto NUNCA fala com IA: não há cliente, chave de API nem chamada de
      rede para provedor nenhum. O servidor produz TEXTO e consome JSON; o
      transporte entre os dois é a pessoa.

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: |
        Não toca o banco (D17) e não expõe versão, driver ou ambiente.
      security: []
      responses:
        "200":
          description: Serviço vivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness
      description: Faz ping no banco. Nenhum detalhe do erro sai na resposta.
      security: []
      responses:
        "200":
          description: Pronto para receber tráfego
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Dependência indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register:
    post:
      tags: [auth]
      operationId: postAuthRegister
      summary: Abre uma tentativa de cadastro e envia o código de 6 dígitos
      description: |
        **Grupo A da §3.12** — devolve 202 com o mesmo corpo, byte a byte, para
        e-mail novo, e-mail já cadastrado e verificado, e e-mail cadastrado e
        ainda não verificado.

        Cada chamada abre a SUA PRÓPRIA tentativa de cadastro, com as
        credenciais deste pedido e um código próprio, e devolve o
        `registrationToken` que amarra os dois. Um pedido nunca destrói nem
        bloqueia o de outra pessoa para o mesmo endereço.

        O cliente **precisa guardar o `registrationToken`** — ele é
        obrigatório em `POST /auth/verify-email`. Perdeu o token? Basta chamar
        este endpoint de novo: o cadastro sempre funciona e sempre devolve um
        token novo amarrado às credenciais informadas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Pedido aceito; se couber, um código foi enfileirado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequired" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: postAuthVerifyEmail
      summary: Confirma o e-mail com o código e já autentica
      description: |
        Exige o `registrationToken` devolvido por `POST /auth/register` (ou por
        `POST /auth/resend-code`) **junto** do código. O código é procurado
        DENTRO da tentativa que o token identifica: um código que pertence a
        outra tentativa do mesmo endereço não existe para efeito de
        validação.

        É essa amarração que fecha o ataque de *pre-hijacking* de conta — o
        código de quem tentou se antecipar chega à caixa do titular, mas é
        inútil sem o token de quem o pediu.

        Em caso de sucesso, ativa as credenciais **da tentativa dona daquele
        código**, destrói todas as outras tentativas pendentes do endereço,
        cria a casa padrão e a associação de dono (ADR-012) e devolve os
        cookies de sessão.

        Só é validável o código que foi **efetivamente enviado** por e-mail.
        Uma tentativa criada enquanto o cooldown ou a cota seguravam a
        mensagem guarda o código, mas ele não valida nada até que o reenvio
        **com o token** entregue a mensagem de verdade — sem isso, cada
        cadastro criaria um alvo de chute novo sem gastar mensagem e o teto de
        envio por endereço deixaria de limitar quantos códigos existem para
        adivinhar.

        **Grupo D da §3.12** — código errado, expirado, já consumido, com
        tentativas esgotadas, de outro propósito, de outra tentativa, nunca
        enviado por e-mail, de e-mail sem código ou de e-mail inexistente
        devolvem todos 401 `INVALID_CODE`, com a mesma mensagem.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: E-mail confirmado; cookies de sessão emitidos
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/InvalidCode" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/resend-code:
    post:
      tags: [auth]
      operationId: postAuthResendCode
      summary: Reenvia o código de confirmação de e-mail
      description: |
        **Grupo B da §3.12** — e-mail existente, inexistente, conta já
        verificada, pedido dentro do cooldown de 60 s e pedido **sem token**
        devolvem 202 com o mesmo corpo.

        O `registrationToken` recebido no cadastro é **obrigatório**: com ele,
        o reenvio troca o código DAQUELA tentativa e devolve o mesmo token,
        que continua valendo — inclusive depois de as 5 tentativas de um
        código terem se esgotado.

        **Sem o token nada é emitido.** Quem pede reenvio não apresenta
        credenciais, então qualquer código emitido para ele teria de herdar as
        credenciais de alguma tentativa existente — e herdar as de outra
        pessoa é a tomada de conta que o ADR-014 fecha. Não adianta restringir
        a "endereço com uma única tentativa viva": o atacante fabrica essa
        condição sozinho, bastando que a tentativa da vítima tenha expirado e
        a dele esteja viva. **Quem perdeu o token refaz o cadastro** — `POST
        /auth/register` sempre funciona e sempre amarra o token novo às
        credenciais de quem pediu.

        A resposta traz sempre um `registrationToken` bem formado, para não
        revelar qual dos caminhos acima foi tomado.

        O envio respeita o cooldown E a cota por endereço — o mesmo balde do
        cadastro, e não um teto por rota. É também o único jeito de tornar
        validável o código de uma tentativa cuja mensagem foi segurada pelo
        cooldown ou pela cota: código que nunca saiu por e-mail não valida
        nada (ver `POST /auth/verify-email`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendCodeRequest" }
      responses:
        "202":
          description: Pedido aceito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequired" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      operationId: postAuthLogin
      summary: Autentica por e-mail e senha
      description: |
        **Grupo E da §3.12** — e-mail inexistente e senha errada devolvem 401
        `INVALID_CREDENTIALS` com a mesma mensagem e o mesmo custo de Argon2id.

        O 403 `EMAIL_NOT_VERIFIED` só é emitido DEPOIS de a senha conferir:
        quem o recebe já provou saber a senha, então nada de novo é revelado.
        Nesse caminho um código novo é reemitido e enviado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Autenticado; cookies de sessão emitidos
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "403":
          description: Conta existe e a senha confere, mas o e-mail não foi confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: postAuthRefresh
      summary: Rotaciona a sessão a partir do cookie de refresh
      description: |
        O refresh usado é sempre invalidado. Reúso de um refresh já revogado
        derruba a família inteira de tokens e grava
        `auth.refresh_reuse_detected` na auditoria.

        **Grupo F da §3.12** — cookie ausente, malformado, expirado, revogado
        ou reusado devolvem 401 `INVALID_SESSION`, e os cookies são sempre
        limpos.
      responses:
        "200":
          description: Sessão rotacionada
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/InvalidSession" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: postAuthLogout
      summary: Encerra a sessão
      description: Idempotente — responde 204 mesmo sem cookie algum.
      responses:
        "204":
          description: Sessão encerrada; cookies limpos
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: postAuthForgotPassword
      summary: Pede um código para redefinir a senha
      description: |
        **Grupo C da §3.12** — e-mail existente e verificado, existente e não
        verificado, ou inexistente devolvem 202 com o mesmo corpo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202":
          description: Pedido aceito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForgotPasswordAccepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: postAuthResetPassword
      summary: Redefine a senha com o código de 6 dígitos
      description: |
        Ao concluir, TODOS os refresh tokens do usuário são revogados
        (docs/SEGURANCA.md §1.1) e os cookies desta requisição são limpos.

        Um código emitido para confirmação de e-mail não é aceito aqui: o
        propósito faz parte do HMAC validado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204":
          description: Senha redefinida; sessões encerradas
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/InvalidCode" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Dados do usuário e da casa ativa
      description: |
        A casa ativa vem da claim `hid` do access token e é REVALIDADA contra
        o banco a cada chamada: se a associação não existir mais, a resposta é
        401 e os cookies são limpos.
      responses:
        "200":
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Lista as contas da casa
      description: |
        Escopo é SEMPRE a casa do token (`hid`); não existe parâmetro de casa.
        `balanceCents` é derivado (ADR-017) — nesta versão da API ainda não há
        lançamento, então ele é igual a `openingBalanceCents`.
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: |
            Inclui as arquivadas. Valor que não seja booleano é 400 — não é
            tratado como `false`, para a tela nunca mostrar um conjunto
            diferente do que pediu.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Contas da casa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Cria uma conta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/KeywordTaken" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Uma conta da casa
      responses:
        "200":
          description: A conta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Edita uma conta
      description: Campos ausentes não são alterados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/KeywordTaken" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Exclui uma conta (exclusão lógica)
      description: |
        Só é permitido quando a conta nunca foi usada. Havendo lançamento, a
        resposta é 422 com `RESOURCE_IN_USE` e o caminho oferecido é arquivar.
      responses:
        "204": { description: Conta excluída }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /accounts/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [accounts]
      operationId: archiveAccount
      summary: Arquiva uma conta
      description: |
        Idempotente: arquivar uma conta já arquivada devolve 200 com o estado
        atual. Conta arquivada some dos seletores de criação e continua no
        histórico e nos relatórios.
      responses:
        "200":
          description: Conta arquivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /accounts/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [accounts]
      operationId: unarchiveAccount
      summary: Desarquiva uma conta
      description: |
        Recusa com 422 se o nome tiver sido tomado por outra conta ativa
        enquanto esta estava arquivada.
      responses:
        "200":
          description: Conta desarquivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Árvore de categorias da casa
      description: |
        Dois níveis (ADR-017b), separados por natureza. As filhas vêm dentro do
        grupo, em `children`.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CategoryKind" }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Categorias da casa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryTree" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Cria grupo ou subcategoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/KeywordTaken" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [categories]
      operationId: getCategory
      summary: Uma categoria da casa
      responses:
        "200":
          description: A categoria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Renomeia uma categoria (ou troca a natureza de um grupo livre)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategoryRequest" }
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/KeywordTaken" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Exclui uma categoria (exclusão lógica)
      description: |
        Recusa com 422 `RESOURCE_IN_USE` se a categoria tiver subcategorias ou
        estiver em uso. O caminho oferecido nesse caso é arquivar.
      responses:
        "204": { description: Categoria excluída }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categories/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [categories]
      operationId: archiveCategory
      summary: Arquiva uma categoria
      description: |
        Arquivar um GRUPO arquiva as subcategorias junto, na mesma transação —
        grupo invisível com filha visível é um estado que a tela não sabe
        desenhar. Idempotente.
      responses:
        "200":
          description: Categoria arquivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categories/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [categories]
      operationId: unarchiveCategory
      summary: Desarquiva uma categoria
      description: |
        Subcategoria só volta se o grupo dela estiver ativo (422 caso
        contrário). Desarquivar um grupo NÃO desarquiva as filhas: quem as
        arquivou antes teve um motivo, e restaurar tudo apagaria essa escolha.
      responses:
        "200":
          description: Categoria desarquivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: Lista os lançamentos de um mês
      description: |
        Escopo é SEMPRE a casa do token (`hid`); não existe parâmetro de casa.

        `month` filtra **`competenceMonth`**, nunca `yearMonth` (ADR-023): há um
        único conceito de mês no app inteiro. Fora de cartão a competência é
        igual ao caixa e nada muda; dentro da fatura, é o mês em que a pessoa
        espera ver o gasto.

        O `summary` vem no MESMO payload de propósito (spec 0004 §5.1): a tela
        mostra os totais do filtro, e uma segunda ida ao servidor traria o risco
        de divergir do que está na lista.

        Esta entrega tem `month`, `accountId`, **`kindGroup`**, **`categoryId`**
        e paginação. Continuam na E2b: busca por descrição, faixa de valor e
        **`sort`** — este último porque ordenação vinda do cliente sem allowlist
        é injeção com outro nome, e nem `kindGroup` nem `categoryId` abrem essa
        porta: o primeiro é um enum fechado e o segundo entra por placeholder,
        os dois viram predicado e nunca texto no `ORDER BY`.
      parameters:
        - name: month
          in: query
          required: true
          description: |
            Mês de COMPETÊNCIA. Obrigatório: ausente, malformado ou com mês fora
            de 01–12 é 400. Nunca "o mês atual por padrão" — a tela mostraria um
            conjunto diferente do que pediu.
          schema: { $ref: "#/components/schemas/YearMonth" }
        - name: accountId
          in: query
          required: false
          description: |
            Conta DA CASA DO TOKEN. Conta de outra casa responde 404, nunca uma
            lista vazia — lista vazia seria indistinguível de "conta sem
            lançamentos" e confirmaria a existência do recurso alheio.
          schema: { type: string, format: uuid }
        - name: kindGroup
          in: query
          required: false
          description: |
            Recorte por **tipo** (spec 0004 §1.6, emenda E2d). Ausente ou vazio
            é **Tudo** — não existe o valor `all`.

            Enum fechado: qualquer outro valor é **400** em `fields.kindGroup`,
            nunca uma lista vazia e nunca o valor recebido de volta na
            mensagem. Ele vira **predicado** na consulta; não há caminho entre
            este parâmetro e o `ORDER BY`.

            A chave aparece **no máximo uma vez**. Duas ou mais ocorrências são
            **400**, **inclusive quando os valores são iguais e inclusive
            quando uma delas é vazia**: a recusa é da ambiguidade da URL, não
            da discordância dos valores — quem lê o primeiro valor e quem lê o
            último montariam listas diferentes para a mesma URL. Uma única
            ocorrência vazia continua significando **Tudo**.

            Ele recorta a **lista** e o `summary` do mesmo jeito, com **uma
            exceção declarada**: `investedCents` e `redeemedCents` são os
            MESMOS nas cinco opções — ver `TransactionSummary`.
          schema: { $ref: "#/components/schemas/TransactionKindGroup" }
        - name: categoryId
          in: query
          required: false
          description: |
            Recorte por **categoria** — o atalho "Ver lançamentos" do relatório
            por categoria.

            Categoria **DA CASA DO TOKEN**: categoria de outra casa responde
            **404**, igual à inexistente e igual ao que `accountId` já faz —
            nunca uma lista vazia, que seria indistinguível de "categoria sem
            lançamentos" e confirmaria a existência do recurso alheio.

            **Grupo inclui as subcategorias.** Pedir um grupo (categoria de
            nível 1) devolve os lançamentos dele E os das filhas dele,
            arquivadas incluídas — é exatamente o conjunto que a linha do grupo
            soma em `GET /reports/by-category`, e é o que faz o atalho entre as
            duas telas mostrar o mesmo dinheiro. Pedir uma subcategoria devolve
            só ela.

            Recorta a **lista** e o `summary` do mesmo jeito, sem exceção. Sob
            este filtro `uncategorizedCount` é 0 por construção: toda linha do
            recorte tem categoria.

            Combina com `kindGroup`: os dois são predicados independentes.
            `kindGroup=transfer` com `categoryId` devolve lista vazia, porque
            transferência não tem categoria por desenho (ADR-016).

            A chave aparece **no máximo uma vez**; duas ou mais são **400**,
            pelo mesmo motivo de `kindGroup`. Ausente ou vazia = todas as
            categorias.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Acima de 100 é 400, nunca truncado em silêncio.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          description: |
            O `nextCursor` da página anterior, e nada mais. Validado
            estritamente; qualquer coisa fora da forma é 400 **sem detalhe**.

            O cursor é **posição, não filtro**. Reenviá-lo com um filtro
            diferente devolve uma página do filtro novo a partir daquela
            posição — o cliente descarta o cursor ao trocar qualquer filtro.
          schema: { $ref: "#/components/schemas/TransactionCursor" }
      responses:
        "200":
          description: Lançamentos do mês, mais o resumo do mesmo filtro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transactions/auto-categorize:
    post:
      tags: [transactions]
      operationId: autoCategorizeTransactions
      summary: Aplica as palavras-chave aos lançamentos SEM categoria de um mês
      description: |
        Só toca receita e despesa (`income`/`expense`) com `categoryId` nulo, da
        casa do token, no mês de **competência** informado. Nunca sobrescreve
        categoria já escolhida (spec 0005 §4.3).

        `dryRun: true` devolve a **prévia**: quantos receberiam categoria, quais
        (com a pontuação e a palavra-chave que decidiu) e quais continuariam sem
        (com o motivo). Nada é gravado.

        `dryRun: false` **recalcula no servidor** — a prévia não é confiada — e
        escreve com `UPDATE ... WHERE category_id IS NULL`, por categoria e em
        fatias, dentro de uma transação. `categorized` é o número de linhas
        **afetadas**. Idempotente: rodar de novo categoriza 0. Uma entrada de
        auditoria por execução real, sem descrição alguma.

        As listas `items` e `unmatchedItems` só vêm preenchidas em `dryRun`
        (vazias na execução real) e têm teto de 500 itens cada; `categorized` e
        `unmatched` são sempre as contagens completas.

        Rate limit próprio, por casa, da classe de escrita pesada (60/h — cada
        uso gasta duas chamadas: prévia e confirmação).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoCategorizeRequest" }
      responses:
        "200":
          description: Prévia (dryRun) ou resultado da escrita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoCategorizeResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Um lançamento da casa
      responses:
        "200":
          description: O lançamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [transactions]
      operationId: updateTransactionCategory
      summary: Troca a categoria de um lançamento
      description: |
        Emenda §11 da spec 0005 — o atalho "Sem categoria" de `/lancamentos`.
        **Só `categoryId`** entra nesta emenda: valor, data, descrição e conta
        chegam com o `PATCH` completo da E2b. Qualquer outro campo no corpo é
        400 (`additionalProperties: false`); `categoryId` ausente, vazio ou fora
        da forma de UUID é 400 em `fields.categoryId`. O nome do campo vale na
        **caixa exata** do contrato (emenda §13): `CategoryId` é 400, como
        qualquer nome fora do contrato.

        Regras, na ordem em que são conferidas:
        - lançamento inexistente ou **de outra casa** → 404, byte a byte igual;
        - perna de transferência (`transfer_out`/`transfer_in`) → 422 em
          `fields.id`: transferência nunca tem categoria (ADR-016);
        - categoria inexistente ou **de outra casa** → 404 (nunca 403);
        - categoria arquivada → 422 em `fields.categoryId`;
        - natureza da categoria diferente do `kind` do lançamento → 422 em
          `fields.categoryId`;
        - categoria que é **grupo com subcategoria ativa** → 422 em
          `fields.categoryId` (emenda §13): o lançamento vai na subcategoria.
          Grupo sem filhas continua válido.

        Categoria já escolhida **é substituída** — é a pessoa recategorizando de
        propósito, uma linha por vez (diferente do auto-categorize, que nunca
        sobrescreve). Mandar a categoria que já está é 200 sem escrita.
        Responde o `Transaction` atualizado (o mesmo de `GET`). Gera uma entrada
        de auditoria `transaction.updated` com o id do lançamento — sem valor,
        sem descrição.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTransactionCategoryRequest" }
      responses:
        "200":
          description: Lançamento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      summary: Exclui um lançamento (exclusão lógica)
      description: |
        Exclusão lógica. Em transferência, o **par inteiro** é excluído
        (ADR-016) — meia transferência não existe, e a tela precisa dizer isso
        em texto antes de confirmar.

        A linha excluída continua ocupando a chave de deduplicação
        (`dedupKey` + `dedupOrdinal`, ADR-025), que não é exposta na API.
        Reimportar o mesmo arquivo a traz de volta como `duplicado_excluido`, e
        liberar a linha na revisão **restaura** o mesmo lançamento em vez de
        inserir outro.
      responses:
        "204": { description: Lançamento excluído }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /card-statements:
    get:
      tags: [card-statements]
      operationId: listCardStatements
      summary: Faturas de cartão da casa
      description: |
        Somente leitura. No v1 a fatura **nasce e morre com a importação**
        (spec 0004 §5.2): não há `POST`, `PATCH` nem `DELETE`, e superfície que
        não existe não precisa ser revisada.

        `totalCents`, `paidCents` e `status` são **derivados** (ADR-023d), nunca
        colunas — mesma disciplina do saldo no ADR-017.
      parameters:
        - name: accountId
          in: query
          required: false
          description: |
            Conta DA CASA e do tipo `credit_card`. Conta de outra casa responde
            404.
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: |
            Competência da fatura, que é o mês do VENCIMENTO, não o do
            fechamento (spec 0004 §3.4, D2).
          schema: { $ref: "#/components/schemas/YearMonth" }
      responses:
        "200":
          description: Faturas da casa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardStatementList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /card-statements/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [card-statements]
      operationId: getCardStatement
      summary: Uma fatura, com os lançamentos dela
      description: |
        Os lançamentos vêm paginados pelo **mesmo cursor** de
        `GET /transactions` — um só formato de cursor no app inteiro.
      parameters:
        - name: limit
          in: query
          required: false
          description: Acima de 100 é 400, nunca truncado em silêncio.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TransactionCursor" }
      responses:
        "200":
          description: A fatura e suas linhas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardStatementDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transfers:
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: Transferências internas do mês, cada PAR uma vez
      description: |
        Cada par de pernas (ADR-016) vira **um** item: data, de → para, valor,
        descrição e origem. `month` filtra por **competência**, como
        `GET /transactions`.

        `accountId` sozinho traz tudo que toca a conta; com
        `counterpartAccountId` traz só o par entre as duas.
        `counterpartAccountId` sem `accountId`, ou igual a ele, é 400. Conta de
        outra casa é 404, byte a byte igual a conta inexistente.

        `pairs` traz, para cada par de contas do resultado, os totais em cada
        sentido, o líquido (`aToBCents − bToACents`) e a contagem — somados no
        servidor, sobre o mês inteiro (não só a página). `balances` traz o
        **saldo de caixa no fim do mês** (`occurredOn` ≤ último dia) das contas
        envolvidas: as duas do filtro quando há filtro, ou todas as que aparecem
        em `pairs`.

        Paginação pelo MESMO cursor de `GET /transactions` — um só formato de
        cursor no app inteiro.
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: "#/components/schemas/YearMonth" }
        - name: accountId
          in: query
          required: false
          description: Conta DA CASA DO TOKEN. Outra casa responde 404.
          schema: { type: string, format: uuid }
        - name: counterpartAccountId
          in: query
          required: false
          description: Exige `accountId` e precisa ser diferente dele (400).
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Acima de 100 é 400, nunca truncado em silêncio.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TransactionCursor" }
      responses:
        "200":
          description: Transferências do mês, pares e saldos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /transfers/detect:
    post:
      tags: [transfers]
      operationId: detectTransfers
      summary: Reprocessa lançamentos já gravados em pares de transferência
      description: |
        Converte, no mês de **competência** informado, pares de lançamentos
        `income`/`expense` já gravados em `transfer_out`/`transfer_in` (spec 0005
        §13, ADR-028). É o caminho para quem importou os extratos **antes** de
        cadastrar as palavras-chave das contas: reimportar cai em
        `duplicado_exato`, e este endpoint reclassifica o que já está no banco.

        **Candidata** é o lançamento vivo `income`/`expense` da casa cuja
        descrição bate (≥ 80, §3) com palavra-chave de conta **ativa** — de
        **outra** conta (a contraparte é conhecida) ou da **própria** conta
        ("isto é transferência entre as minhas contas", contraparte
        desconhecida). **Espelho** é outro lançamento vivo `income`/`expense`,
        em outra conta ativa, de sentido oposto, mesmo valor, `occurredOn` a
        ±3 dias, ainda não reivindicado nesta execução: com contraparte
        conhecida `K`, o espelho tem de estar em `K`; com palavra da própria
        conta, o espelho também precisa bater com palavra da própria conta dele
        ou da conta da candidata — sem isso, "Pix enviado a mim mesmo" casaria
        com qualquer receita de mesmo valor na vizinhança. Empate entre contas
        na pontuação máxima → não é candidata. Desempate entre espelhos:
        o que também é candidata, depois menor distância em dias, depois menor
        `occurredOn`, depois menor id — determinístico.

        **Nunca inventa perna.** Candidata sem espelho fica como está e aparece
        em `unpairedItems` com `reason: no_mirror` — criar perna sintética aqui
        duplicaria dinheiro na próxima importação da outra conta. A orientação
        é importar o extrato da outra conta e reprocessar.

        **Despesa ligada a uma fatura de cartão não é reprocessada** — nem como
        candidata, nem como espelho. O total cobrado da fatura é o número que a
        pessoa confere contra a cobrança do banco, e converter uma compra em
        `transfer_out` o reduziria: nada que este endpoint faz pode mexer nele.
        A **receita** de fatura (o "Pagamento recebido" no cartão) continua
        participando e vira `transfer_in` — é o pagamento da fatura, e essa é
        justamente a classificação certa (ADR-016); ela deixa de abater o total
        e passa a contar como pago, sem alterar a dívida da fatura nem o saldo
        das contas.

        `dryRun: true` devolve a **prévia**: quantos pares seriam convertidos,
        quais (com a palavra-chave e a pontuação que decidiram) e quais
        candidatas ficariam sem par. Nada é gravado nem auditado.

        `dryRun: false` **recalcula no servidor** — a prévia não é confiada —
        e converte cada par com `UPDATE` condicional (`WHERE household_id = ?
        AND id = ? AND deleted_at IS NULL AND transfer_group_id IS NULL AND
        kind = <esperado>`), conferindo **duas linhas afetadas por par**,
        dentro de **uma** transação: qualquer coisa diferente desfaz tudo e
        responde 409 `CONFLICT` — a tela pede a prévia de novo. A `expense`
        vira `transfer_out`, a `income` vira `transfer_in`, `categoryId` das
        duas vira nulo, e **nada mais muda**: valor, data, competência,
        descrição, origem, lote, `externalId` e a chave de deduplicação ficam
        como estão — reimportar o mesmo arquivo continua caindo em
        `duplicado_exato`, e o saldo das duas contas não muda. Idempotente:
        rodar de novo responde `paired: 0`. Uma entrada de auditoria por
        execução real (`transaction.transfers_detected`, entidade
        `transaction_month`), sem descrição nem valor.

        As listas `items` e `unpairedItems` só vêm preenchidas em `dryRun`
        (vazias na execução real) e têm teto de 500 itens cada; `paired` e
        `unpaired` são sempre as contagens completas. Teto de 10.000
        candidatas por mês, 20.000 linhas na janela de espelhos e um teto de
        trabalho do pareamento — passar de qualquer um é 422, nunca execução
        parcial.

        O corpo **não tem ids**: o cliente não escolhe o que converter. Rate
        limit próprio, por casa, 60/h (cada uso gasta prévia + confirmação),
        em balde separado do `auto-categorize`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferDetectRequest" }
      responses:
        "200":
          description: Prévia (dryRun) ou resultado da conversão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferDetectResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /investments:
    get:
      tags: [investments]
      operationId: getInvestments
      summary: Aportes e resgates do mês, do ano até o mês, e a série de 12 meses
      description: |
        Responde **quanto foi investido**, nunca **quanto eu tenho**: não há
        patrimônio, posição, rentabilidade nem saldo investido acumulado (spec
        0006 §2.2). Nenhum número acumulado além dos dois do ano corrente.

        Um lançamento entra aqui quando a categoria dele é de natureza
        `investment` ou `redemption` (ADR-029a), incluindo categoria
        **arquivada** — arquivar não desfaz a marcação do passado. O **fluxo**
        vem do `kind` do lançamento, nunca da natureza da categoria: `expense`
        é aporte (`contribution`), `income` é resgate (`redemption`). É o mesmo
        predicado do `summary` de `GET /transactions`, de propósito: o que sai
        de `expenseCents` é exatamente o que entra em `investedCents`, e as duas
        telas não podem divergir (ADR-029d).

        `month` filtra por **competência**, como `GET /transactions`.
        `monthly` e `yearToDate` são **completos** (não dependem da página);
        `yearToDate` vai de 1º de janeiro do ano do `month` até o `month`,
        inclusive, no ano civil da casa. `series` tem **sempre 12 itens**, do
        mês selecionado para trás, em ordem cronológica crescente, com zeros nos
        meses sem movimento — o cliente não escolhe o tamanho e não precisa
        tratar buraco.

        `items` é a lista do **mês**, paginada pelo MESMO cursor de
        `GET /transactions` — um só formato de cursor no app inteiro.

        Casa sem nenhuma categoria de investimento responde zeros, `items: []`
        e `series` com 12 itens zerados, **sem consultar lançamento nenhum**
        (ADR-029f). O saldo das contas não é afetado por nada nesta resposta: o
        aporte saiu da conta e continua descontado (ADR-017).
      parameters:
        - name: month
          in: query
          required: true
          description: |
            Mês de COMPETÊNCIA. Obrigatório: ausente, malformado ou com mês fora
            de 01–12 é 400. Nunca "o mês atual por padrão".
          schema: { $ref: "#/components/schemas/YearMonth" }
        - name: limit
          in: query
          required: false
          description: |
            Tamanho da página de `items`. Acima de 100 é 400, nunca truncado em
            silêncio — o mesmo teto e o mesmo NOME de parâmetro de
            `GET /transactions` e `GET /transfers`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          description: O `nextCursor` da página anterior, e nada mais. Forma inválida é 400 sem detalhe.
          schema: { $ref: "#/components/schemas/TransactionCursor" }
      responses:
        "200":
          description: Números do mês, do ano até o mês, série de 12 meses e a lista do mês
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestmentOverview" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "500": { $ref: "#/components/responses/InternalError" }

  /investments/detect:
    post:
      tags: [investments]
      operationId: detectInvestments
      summary: Marca lançamentos já gravados com categoria de investimento, por palavra-chave
      description: |
        Aplica as palavras-chave da casa (spec 0005 §3) aos lançamentos
        `income`/`expense` **vivos** do mês de **competência** e marca os que
        casam com uma categoria de natureza `investment`/`redemption`. É o
        caminho retroativo: quem já importou meses antes de criar as categorias
        de investimento conserta o mês em dois cliques, sem reimportar.

        A correspondência é a **mesma** do `auto-categorize` — uma passagem por
        lado do dinheiro, limiar 80, empate entre categorias diferentes é
        `ambiguous` e não vira sugestão (ADR-026a, ADR-029g). Por isso um
        lançamento cuja melhor categoria é de despesa comum **não** é marcado
        aqui: ele aparece em `unmatchedItems` com `other_category`, e quem o
        categoriza é o `auto-categorize`.

        `dryRun: true` devolve a **prévia** e não grava nem audita nada.
        `dryRun: false` **recalcula no servidor** — a prévia nunca é confiada —
        e escreve dentro de **uma** transação, com `UPDATE` condicional:
        `marked` é o número de linhas **afetadas**. Idempotente: rodar de novo
        marca 0. Uma entrada de auditoria por execução real, com entidade
        `transaction_month` e id = o mês, sem descrição, sem valor e sem
        palavra-chave. A **ação** distingue as duas execuções, porque elas não
        são a mesma operação: `transaction.investments_detected` quando a
        escrita só preenche o que estava vazio, e
        `transaction.investments_overwritten` quando o pedido trouxe
        `overwriteCategorized: true` — a única escrita do projeto autorizada a
        substituir, em massa e sem desfazer, categoria escolhida por uma
        pessoa. A ação sai da **flag do pedido**, não de ter havido linha
        trocada.

        **Sem `overwriteCategorized`** (ausente ou `false`), a escrita só toca
        `category_id IS NULL`: lançamento que já tem categoria **nunca** é
        alterado — ele aparece na prévia em `alreadyCategorizedItems` só para a
        pessoa saber que existe. **Com `overwriteCategorized: true`** a troca é
        autorizada, mas continua fechada por allowlist dentro do `WHERE`: só
        substitui categoria de natureza `income`/`expense`, então **nunca**
        desfaz uma marcação de investimento já existente — nem a de outra
        execução, nem a que a pessoa fez à mão (ADR-029h). A tela pede
        confirmação própria para esse caminho.

        Transferência nunca é tocada (não tem categoria — ADR-016), lançamento
        excluído nunca é tocado, e lançamento de outra casa não existe para esta
        rota.

        As três listas só vêm preenchidas em `dryRun` (vazias na execução real)
        e têm teto de 500 itens cada; `marked`, `unmatched` e
        `alreadyCategorized` são **sempre** as contagens completas. Mês com mais
        de 10.000 lançamentos candidatos — receitas e despesas **vivas** do mês,
        com ou sem categoria, porque todas são lidas para montar a prévia — é
        **422 `VALIDATION_FAILED` em `fields.month`, nunca execução parcial**. Rate limit próprio
        por casa, 60/h, em balde separado do `auto-categorize` e do
        `transfers/detect` — cada uso gasta prévia + confirmação.

        O cálculo roda **fora** da transação e a escrita roda **dentro** dela,
        então cabe uma requisição inteira entre os dois. Antes dos `UPDATE`, a
        transação **reconfere em uma consulta** o estado atual das categorias
        envolvidas. A categoria de **destino** precisa continuar sendo tudo o
        que a qualificou na prévia: da casa, **viva**, **não arquivada**, sem
        subcategoria ativa, e de natureza `investment`/`redemption` compatível
        com o lado do dinheiro daquele lote — trocar a natureza dentro do mesmo
        lado é permitido mesmo com a categoria em uso, então ela pode ter
        deixado de qualificar no meio do caminho. Faltando qualquer um, a
        operação **inteira** é desfeita com **409 `CONFLICT`**, **nada** é
        gravado e a ação da tela é pedir a prévia de novo (ADR-028d).

        **A distinção do arquivamento é sutil e vale por inteiro:** *marcação
        existente* sobrevive ao arquivamento — categoria arquivada continua
        contando e o lançamento que já aponta para ela continua apontando —, mas
        *atribuição nova* a categoria arquivada é recusada, aqui como em
        `PATCH /transactions/{id}`, no lote e na importação. Por isso a
        categoria de **origem** arquivada **continua trocável** (é a linha presa
        numa categoria que a casa aposentou, um dos casos que a flag existe para
        resolver), enquanto a de **destino** arquivada é conflito.

        No outro sentido, a categoria de **origem** que tiver virado de
        investimento na mesma janela apenas sai da allowlist da troca, em vez de
        derrubar a operação: a marcação que a pessoa acabou de fazer à mão é
        preservada e as demais linhas seguem.

        Quando o prazo da fase de cálculo estoura, a resposta é **422
        `VALIDATION_FAILED` em `fields.month`** — é limite de trabalho, não
        falha do servidor, e a orientação é a mesma dos outros tetos desta
        família: período menor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestmentDetectRequest" }
      responses:
        "200":
          description: Prévia (dryRun) ou resultado da marcação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestmentDetectResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /reports/by-category:
    get:
      tags: [reports]
      operationId: getCategoryReport
      summary: Distribuição do mês por categoria — o grupo soma as subcategorias
      description: |
        Soma, por categoria, os lançamentos **vivos** do mês de **competência**
        (ADR-023c) com a natureza pedida. Transferência nunca entra (ADR-016);
        lançamento excluído sai na hora; categoria **arquivada** continua
        contando (`archivedAt` preenchido). Lançamento sem categoria vira um
        item **explícito** com `categoryId: null` — nunca é omitido.

        **Aporte e resgate não entram** (ADR-029e): o lançamento cuja categoria
        é de natureza `investment` ou `redemption` é descartado dos totais **e**
        das linhas — ele não é gasto nem receita, é dinheiro guardado ou
        retirado, e tem tela própria (`GET /investments`). O balde "Sem
        categoria" **não** muda: quem não tem categoria não tem natureza.

        `kind` continua `income|expense` (ADR-029h): o relatório de
        investimento é uma tela própria, não um `kind` a mais. O recorte por
        tipo de conta é o parâmetro **ortogonal** `accountGroup` (ADR-032) —
        não é natureza, e por isso não entra em `kind`. `credit` restringe às
        contas de tipo `credit_card` (arquivadas incluídas); `debit` é o
        **complemento** (toda conta que não é cartão de crédito). Para o mesmo
        `month` e `kind`, `total(credit) + total(debit) == total(sem
        accountGroup)` — por total, por contagem e por categoria: as três são
        leituras das mesmas linhas. Toda combinação `kind × accountGroup` é
        aceita e calculada (`income + credit` são os estornos na fatura), ainda
        que a tela ofereça só algumas.

        Cada um dos três parâmetros pode aparecer **no máximo uma vez** na
        query: `?kind=expense&kind=income` é 400 no campo repetido, sem
        consultar nada (HPP — ver `SoleQueryValue`).

        Cada grupo (nível 1) traz `totalCents = directCents + Σ children.totalCents`
        e o mesmo para `count`; `directCents` é o que foi lançado **no próprio
        grupo**, sem subcategoria. `items` vem ordenado por `totalCents`
        decrescente (empate: `count` decrescente, depois nome).

        `shareBp` é a participação no total do mês em **pontos-base** (0..10000),
        apurada no servidor pelo método do maior resto em dois níveis:
        `Σ items[].shareBp == 10000` (quando `totalCents > 0`) e
        `item.shareBp == item.directShareBp + Σ children[].shareBp`, exatos.
        O cliente **formata** o percentual; nunca o calcula (ADR-027c).
        Categoria sem lançamento no mês não aparece; mês vazio devolve
        `items: []` e `totalCents: 0`.
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: "#/components/schemas/YearMonth" }
        - name: kind
          in: query
          required: false
          description: Natureza. Ausente = `expense`. Fora da allowlist é 400. Repetido é 400.
          schema: { type: string, enum: [expense, income], default: expense }
        - name: accountGroup
          in: query
          required: false
          description: |
            Recorte por tipo de conta (ADR-032). **Ausente = todas as contas**,
            e é a URL canônica — `?accountGroup=` vazio vale o mesmo, pela
            convenção de valor vazio declarada no topo deste contrato.
            `credit` = contas `credit_card` (arquivadas incluídas);
            `debit` = todas as demais. Allowlist exata, sem normalização:
            `CREDIT`, `credit_card` e `credit,debit` são 400 em
            `fields.accountGroup`. Repetido é 400. Nunca aceita id de conta —
            o conjunto de cartões é resolvido no servidor sobre as contas da
            casa do token.
          schema: { type: string, enum: [credit, debit] }
      responses:
        "200":
          description: Distribuição do mês por categoria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryReport" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: O resumo do mês do painel — investido (líquido), receita e gasto no cartão
      description: |
        **Um pedido, uma faixa** (`PLANOS.md` §7.4): a tela `/` monta os três
        números do mês com esta chamada e nenhuma outra. Tudo é **competência**
        (ADR-023c) e escopado pela casa do **token** — `month` é o único
        parâmetro lido, e qualquer outro (`householdId=`, `accountId=`) é
        ignorado sem efeito.

        Os três números, e o que cada um deliberadamente **não** conta:

        - `investmentNetCents` — **aportes − resgates** da competência, **com
          sinal**. Aporte é o lançamento `expense` e resgate é o `income` cuja
          categoria é de natureza `investment`/`redemption` (ADR-029d),
          categoria **arquivada incluída**. É o único número desta resposta que
          pode ser negativo, e o cliente **não** o calcula: dinheiro é somado num
          lugar só.
        - `incomeCents` — receitas vivas da competência **menos os resgates**.
          Incluí-los faria o mesmo dinheiro aparecer duas vezes na mesma faixa
          (`+1.000` na receita e `−1.000` no investimento) e divergir da faixa
          "Entrou" de `GET /transactions`. É, byte a byte, o `summary.incomeCents`
          daquela rota no mesmo mês.
        - `creditCardExpenseCents` — despesas vivas da competência em contas de
          tipo `credit_card`, **somadas num número só** (todos os cartões
          juntos), **menos** os aportes lançados em cartão — o mesmo dinheiro não
          é contado duas vezes na mesma faixa. Cartão **arquivado** continua
          contando: arquivar não apaga o passado.

        **Transferência interna não entra em nada** (ADR-016) — nem na receita,
        nem no cartão: a perna que cai no cartão é `transfer_in` e não é gasto,
        e pagar a fatura não muda nenhum dos três números.

        `creditCardAccountCount` e `investmentCategoryCount` existem para a tela
        distinguir **"não tem cartão cadastrado"** de **"tem cartão e não gastou"**
        sem adivinhar. O primeiro conta as contas de cartão **vivas e não
        arquivadas**; o segundo, as categorias de natureza `investment`/`redemption`
        da casa **com as arquivadas**. Os dois critérios são diferentes de
        propósito.

        Mês sem movimento devolve zeros — nunca `null`, nunca campo ausente.
      parameters:
        - name: month
          in: query
          required: true
          description: |
            Mês de COMPETÊNCIA. Obrigatório: ausente, malformado (`2026-9`,
            ` 2026-09`) ou com mês fora de 01–12 é 400 em `fields.month`. Nada é
            normalizado — a recusa não ensina nada sobre o servidor.
          schema: { $ref: "#/components/schemas/YearMonth" }
      responses:
        "200":
          description: Os três números do mês, as contagens que os explicam e os dois contadores de estado vazio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /imports:
    get:
      tags: [imports]
      operationId: listImports
      summary: Histórico dos últimos lotes de importação da casa
      description: |
        Até 50 lotes, do mais recente para o mais antigo. Lote `pending` traz
        `counts` (a análise por status) e `outcome` nulo; lote `committed` traz
        o contrário — as linhas de *staging* são apagadas **fisicamente** no
        commit (spec 0004 §3.6), e a análise por status deixa de existir.
      responses:
        "200":
          description: Lotes da casa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [imports]
      operationId: createImport
      summary: Envia o arquivo e ANALISA (fase 1 de 2 — nada é gravado ainda)
      description: |
        **Esta rota não cria lançamento nenhum.** Ela extrai, detecta o formato,
        parseia, deduplica e grava o resultado num *staging* (`import_batches` +
        `import_rows`) que vive **24 h**. Só `POST /imports/{id}/confirm` grava
        em `transactions` (ADR-024c).

        **A única rota com corpo em `multipart/form-data`** e a única com teto
        de corpo de **8 MiB** — exceção declarada por caminho exato, sem prefixo
        e sem curinga; todas as outras rotas continuam em 1 MiB (spec 0004
        §6.4). `Content-Type: application/json` aqui é 415.

        Parte com nome fora da allowlist de quatro é **400**, nunca ignorada em
        silêncio. O tipo real do arquivo vem dos *magic bytes* do ZIP, nunca da
        extensão nem do `Content-Type` da parte.

        **A instituição da conta NÃO escolhe o parser** — quem escolhe é a
        detecção por cabeçalho. A `institution` da conta é trava de
        consistência: detectou `nubank` numa conta marcada `c6` → 422
        `IMPORT_TARGET_MISMATCH`, e nada é importado. A trava mais forte é a
        outra: fatura só entra em conta `credit_card`, e extrato só entra em
        conta que não seja cartão.

        Rate limit próprio: 10/h por casa e 20/h por IP — é a rota mais cara do
        sistema (inflate, parse e varredura de deduplicação).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateImportRequest" }
            encoding:
              file:
                contentType: text/csv, application/zip, application/octet-stream
              accountId: { contentType: text/plain }
              password: { contentType: text/plain }
              format: { contentType: text/plain }
      responses:
        "201":
          description: |
            Arquivo analisado e em *staging*. Nenhum lançamento foi criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ImportRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /imports/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [imports]
      operationId: getImport
      summary: Revisão do lote (fase 2 — paginada)
      description: |
        A revisão mostra **exatamente o que será gravado**: descrição já
        sanitizada e truncada, valor já em centavos, data já civil. A linha crua
        do arquivo **não** é guardada nem devolvida — ela carregaria CPF
        mascarado, agência e conta de terceiros num lugar novo, para exibir algo
        DIFERENTE do que entra (spec 0004 §3.6 e §6.8).

        Lote de outra casa responde 404, byte a byte igual a lote inexistente.
      parameters:
        - name: limit
          in: query
          required: false
          description: Acima de 200 é 400, nunca truncado em silêncio.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          required: false
          description: |
            O `seq` da última linha devolvida — é o `nextCursor` da página
            anterior. A paginação do *staging* é por sequência no arquivo, e não
            por cursor opaco: o `seq` já é único e estável dentro do lote, e o
            lote já é escopado pela casa.
          schema: { $ref: "#/components/schemas/ImportRowCursor" }
      responses:
        "200":
          description: Lote, contadores e uma página de linhas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [imports]
      operationId: discardImport
      summary: Descarta o lote e apaga as linhas de staging
      description: |
        Descarte explícito do dado financeiro parado no *staging*: as linhas são
        apagadas **fisicamente** e o lote fica como `discarded`, só com os
        contadores. Lote já `committed` responde 404 — não se descarta o que já
        virou lançamento.
      responses:
        "204": { description: Lote descartado }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /imports/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [imports]
      operationId: confirmImport
      summary: Confirma o lote e grava os lançamentos (fase 2 de 2)
      description: |
        O corpo carrega **apenas as exceções** ao default de cada status
        (spec 0004 §4.6), com teto de **2.000** decisões. Linha não citada usa o
        default; **linha marcada só entra com `action: "import"` explícito** — é
        a exigência do usuário, escrita no contrato.

        Valor, data, descrição e `kind` **vêm do staging**, nunca do cliente: o
        corpo não tem onde carregá-los, e mandá-los é 400. `householdId`,
        `dedupKey`, `dedupOrdinal`, `yearMonth`, `competenceMonth`,
        `descriptionNorm`, `source` e `createdBy` não existem em nenhum DTO de
        entrada.

        **Idempotente** (S9): a transição `pending -> committed` é condicional e
        acontece dentro do `UnitOfWork`. Dois cliques em conexão ruim produzem
        UM conjunto de lançamentos e a mesma resposta 200. Lote `discarded` ou
        `expired` responde 404.

        **Tudo ou nada** para o lote. Linha bloqueada **não** é falha do lote: é
        linha não inserida, devolvida em `blockedRows`. A análise da fase 1 é um
        palpite — entre o envio e a confirmação o outro morador pode ter
        importado o mesmo arquivo —, então o confirm **recalcula tudo dentro da
        transação**, e o índice único é o árbitro final.

        Rate limit próprio: 30/h por casa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmImportRequest" }
      responses:
        "200":
          description: Lote confirmado (ou já confirmado antes — mesma resposta)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ImportRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Menu IA (spec 0010, entrega E9) — integração com IA é FORA DO PROCESSO.
  #
  # Nenhuma das três rotas abaixo fala com provedor de IA. A primeira devolve
  # TEXTO para a pessoa copiar; as outras duas recebem o JSON que ela colou de
  # volta. Não existe cliente de IA, chave de API nem saída de rede no backend,
  # e é por isso que os pacotes Go são `aiprompt` (leitura pura) e `aiimport`
  # (escrita transacional), nunca um `ai` que alguém tentasse "completar".
  # ---------------------------------------------------------------------------

  /ai/export-prompt:
    get:
      tags: [ai]
      operationId: getAiExportPrompt
      summary: Monta o prompt em Markdown da janela de trabalho (leitura pura)
      description: |
        **Não escreve nada** — nem lançamento, nem categoria, nem auditoria. A
        rota agrega os lançamentos vivos da janela por `description_norm`, lê as
        contas e as categorias **ativas** da casa do token e devolve o texto
        pronto que a pessoa vai copiar.

        **O aplicativo não envia este texto a lugar nenhum.** Quem copia é a
        pessoa, e a tela precisa dizer isso **antes** de qualquer botão de
        copiar ou baixar: o prompt carrega descrições e valores das
        movimentações, e colá-lo numa IA de terceiros é mandar esses dados para
        fora. É a única ameaça nova desta feature, e a mitigação é consentimento
        informado mais minimização — não há terceira opção quando o transporte é
        a pessoa.

        **Minimização (normativa, §3.1 da spec 0010):** o texto não contém id da
        casa, nome ou e-mail de ninguém, saldo de conta, agência, número de
        conta nem id de lançamento. Os ids de conta e de categoria vão porque
        são a **chave de volta** do import — são opacos e inúteis fora desta
        casa. Conta e categoria **arquivadas** não aparecem.

        A janela é de **competência** (ADR-023c), em meses civis, e no máximo
        **3 inclusive** — `2026-07` a `2026-09` passa, `2026-06` a `2026-09` é
        **400 `VALIDATION_FAILED`** em `fields.toMonth`. Não há código de erro
        novo para isso: a ação da tela é a mesma de qualquer entrada inválida
        (D4 da spec 0003), e ela já barra antes de chamar.

        Período sem movimentação gera prompt **válido** mesmo assim — contas e
        categorias bastam —, com uma linha dizendo que não houve movimentação.

        **Janela grande demais para um prompt só é 422**, em `fields.toMonth`, e
        **nunca uma resposta parcial**: a agregação por `description_norm` tem
        teto de linhas (`MaxDescriptionGroupRows`) e a semântica é tudo ou nada.
        Um prompt silenciosamente incompleto faria a IA propor palavra-chave
        para metade da casa sem ninguém saber — por isso o corte que o texto
        aceita (as descrições menos frequentes, declaradas em
        `stats.truncatedDescriptions`) é outro, e muito menor, do que este teto.
        Sem código de erro novo: `VALIDATION_FAILED`, como todo outro teto de
        volume do projeto.
      parameters:
        - name: fromMonth
          in: query
          required: true
          description: |
            Primeiro mês de **competência** da janela. Obrigatório: ausente,
            vazio (`?fromMonth=`), malformado (`2026-7`, ` 2026-07`) ou com mês
            fora de 01–12 é 400 em `fields.fromMonth`. Nada é normalizado — a
            recusa não ensina nada sobre o servidor.

            **Repetido é 400.** Esta rota nasce lendo o parâmetro com
            `SoleQueryValue`, e não pela primeira ocorrência: a poluição de
            parâmetro é dívida conhecida das rotas antigas (`docs/ROADMAP.md`),
            e dívida não se herda em rota nova.
          schema: { $ref: "#/components/schemas/YearMonth" }
        - name: toMonth
          in: query
          required: true
          description: |
            Último mês de **competência** da janela, inclusive. Mesmas recusas
            do `fromMonth`, e mais duas, ambas em `fields.toMonth`:
            `toMonth < fromMonth` é 400, e janela de **mais de 3 meses** é 400.
          schema: { $ref: "#/components/schemas/YearMonth" }
      responses:
        "200":
          description: O prompt pronto e as contagens que a tela mostra ao lado dele
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiExportPrompt" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /ai/keyword-import/preview:
    post:
      tags: [ai]
      operationId: previewAiKeywordImport
      summary: Confere o JSON da IA e devolve o relatório — sem gravar nada
      description: |
        Roda **todas** as validações da §4 da spec 0010 e **não escreve uma
        linha**: nem categoria, nem palavra-chave, nem auditoria. É a prévia
        obrigatória antes do confirm.

        **O JSON é entrada hostil.** Veio de uma IA, que erra e inventa, e o
        texto pode ter passado por qualquer lugar no caminho. Por isso: teto de
        corpo de **128 KiB** (acima disso é **413**, cortado pelo
        `MaxBytesReader` antes de qualquer parsing de negócio), teto de **200
        entradas** por lista e **20 palavras** por entrada,
        `additionalProperties: false` em todo nível, conjunto fechado de campos
        — e **zero eco do conteúdo colado** nas mensagens de erro.

        **Recusa é relatório, não status.** Não existe 404 nem 409 nesta rota:
        id de outra casa volta como `item_not_found` no relatório,
        **indistinguível** de id inexistente (BOLA, risco nº 1), e uma entrada
        recusada **nunca derruba o lote** — o que é válido entra, o que não é
        volta com o motivo. O 400 fica para o que impede o relatório de existir:
        JSON malformado, versão diferente de `1`, campo desconhecido, lista
        acima do teto, ou as três listas ausentes/vazias (`fields.payload`).
        O 422 é o mesmo da exportação, em `fields.toMonth`: a janela tem
        descrições demais para a medição de impacto caber (teto
        `MaxDescriptionGroupRows`, tudo ou nada), ou o orçamento de trabalho do
        `internal/textmatch` estourou — e nunca uma medição parcial.

        **`impact` só existe aqui, e só em item de conta.** Para cada item de
        conta, o servidor mede quantos lançamentos vivos `income`/`expense` da
        janela passariam a ser **candidatos a transferência** por causa das
        palavras que **entrariam** naquele item (`added`), rodando o
        `internal/textmatch` sobre as descrições do período — sem escrever
        nada. É o estrago medido antes de acontecer: `pagamento` com 87 salta
        aos olhos, `nu pagamentos` com 4 passa batido, e deve mesmo.
        Palavra-chave de **categoria** não recebe a medição: categorizar errado
        se desfaz numa linha, converter transferência errada mexe em duas. O
        denominador da frase "87 de 212" é `totals.periodTransactions`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeywordImportEnvelope" }
      responses:
        "200":
          description: Relatório do que entraria. **Nada foi gravado.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeywordImportReport" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /ai/keyword-import/confirm:
    post:
      tags: [ai]
      operationId: confirmAiKeywordImport
      summary: Aplica o import numa única transação, revalidando tudo do zero
      description: |
        **Mesmo corpo da prévia**, com `skipNewCategories` preenchido conforme a
        pessoa desmarcou. Os corpos são idênticos de propósito: é o que torna
        literal a promessa de que **a prévia não é credencial**.

        **O servidor revalida tudo do zero.** Nada do relatório anterior é
        reaproveitado — nem o que passou, nem o que foi recusado. Entre a prévia
        e o clique o outro morador pode ter criado a categoria, arquivado a
        conta ou tomado a palavra-chave, e um confirm que confiasse na prévia
        gravaria contra um estado que não existe mais.

        Grava em **uma única transação** (`UnitOfWork`), nesta ordem: grupos
        novos → subcategorias novas → palavras-chave. Falha no meio não deixa
        nada pela metade. A criação de categoria passa pelo **mesmo caminho** do
        `POST /categories` — mesmo teto de 200 por casa, mesma resolução do pai
        dentro da casa do token, mesma recusa do terceiro nível, mesma herança
        de natureza e mesma auditoria —, nunca um atalho paralelo.

        **O formato não tem como destruir nada:** não existe campo para
        renomear, mover, arquivar ou excluir categoria, e não existe remoção de
        palavra-chave. A operação é **aditiva**, e o pior caso de um JSON
        malicioso é categoria a mais, que se arquiva num clique. Tentar incluir
        um campo desses é 400 por campo desconhecido.

        **Reimportar o mesmo JSON é inofensivo:** palavra que o item já tem é
        `already_present`, e nada é gravado.

        `fromMonth`/`toMonth` são validados e a janela é usada para UMA coisa
        só: o `totals.periodTransactions` que o schema exige nas duas rotas. A
        medição de impacto é da prévia, e `impact` não vem nesta resposta.

        **409 `CONFLICT`** quando o estado mudou entre a leitura e a escrita da
        MESMA transação: outra requisição criou a categoria, tomou a
        palavra-chave, deu subcategoria ao grupo ou excluiu o item no meio. A
        transação inteira foi desfeita — **nada** foi gravado — e a ação da
        tela é pedir a prévia de novo. É o mesmo desfecho de
        `POST /transfers/detect` e de `POST /investments/detect`. O 422 é o da
        prévia (`fields.toMonth`): a janela tem descrições demais para o
        denominador ser contado, tudo ou nada.

        **Auditoria:** categoria criada gera `category.created`; palavra-chave
        gera `category.updated`/`account.updated` por item; e **uma** entrada
        `ai.keyword_import_confirmed` por execução marca a ORIGEM. As palavras
        nunca entram no log (spec 0005 §4.1).

        Confirmar **não reprocessa nada**. Palavra-chave nova só passa a valer
        quando a pessoa roda `POST /transfers/detect` e depois
        `POST /transactions/auto-categorize` — nesta ordem, e por clique dela.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeywordImportEnvelope" }
      responses:
        "200":
          description: O que **de fato** entrou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeywordImportReport" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/BusinessRuleRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }


components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-hf_access
      description: |
        JWT HS256 de vida curta (15 min). Sem o prefixo `__Host-` quando
        `COOKIE_SECURE=false` (apenas desenvolvimento).

  headers:
    SetSessionCookie:
      description: |
        Dois cookies são emitidos: `hf_access` (JWT, 15 min) e `hf_refresh`
        (token opaco, 14 dias), ambos
        `HttpOnly; Secure; SameSite=Strict; Path=/`, com prefixo `__Host-`
        quando `COOKIE_SECURE=true`.
      schema: { type: string }
    ClearSessionCookie:
      description: Cookies de sessão expirados (Max-Age=-1).
      schema: { type: string }

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      description: |
        Identificador do recurso NA CASA DO TOKEN. Id de outra casa responde
        404, nunca 403 — 403 confirmaria que o recurso existe (S1 do
        PLANOS.md).
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: |
        Recurso nao encontrado. E a MESMA resposta para "nao existe" e para
        "existe, mas e de outra casa".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BusinessRuleRejected:
      description: |
        O corpo esta bem formado, mas uma regra de negocio recusou: nome ja
        usado, limite de quantidade atingido, ou recurso em uso
        (RESOURCE_IN_USE). Diferente de 400, que e entrada malformada.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    ValidationFailed:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthenticated:
      description: Autenticação necessária
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: E-mail ou senha inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCode:
      description: Código inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidSession:
      description: Sessão inválida; cookies limpos
      headers:
        Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Muitas requisições
      headers:
        Retry-After:
          description: Segundos até a próxima tentativa permitida
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: |
        Corpo acima do limite DA ROTA. O teto global é 1 MiB; `POST /imports` é
        a única exceção, com 8 MiB, declarada por caminho exato — sem prefixo e
        sem curinga (spec 0004 §6.4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: |
        Content-Type diferente do exigido pela rota: `application/json` em todas,
        exceto `POST /imports`, que exige `multipart/form-data`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Erro interno; nenhum detalhe é exposto
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ImportRejected:
      description: |
        O arquivo, o formato ou a conta de destino foram recusados por uma regra
        da importação. O `code` diz **o que a tela deve fazer** — ver
        `ImportErrorCode`. Nenhum lançamento foi criado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportError" }
    Conflict:
      description: |
        O estado mudou entre a leitura e a escrita da mesma operação: em
        `POST /transfers/detect`, o `UPDATE` condicional de um par não afetou
        exatamente duas linhas (alguém excluiu, converteu ou editou um dos
        lançamentos no meio); em `POST /investments/detect`, uma categoria de
        destino do plano deixou de qualificar entre o cálculo e a escrita — foi
        excluída, arquivada, ganhou subcategoria ativa, ou deixou de ser de
        natureza de investimento compatível com o lote; em
        `POST /ai/keyword-import/confirm`, uma categoria, um grupo ou uma
        palavra-chave que o relatório pré-conferiu mudou de estado entre a
        leitura e a escrita da mesma transação. A transação inteira foi
        desfeita — **nada** foi gravado. A ação da tela é pedir a prévia de
        novo.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeywordTaken:
      description: |
        A palavra-chave já pertence a OUTRA categoria (ou outra conta) desta
        mesma casa. Conjuntos independentes: a mesma palavra pode estar numa
        categoria e numa conta ao mesmo tempo. `fields.keyword` é a palavra
        recusada; `fields.ownerId` é quem já a tem — sempre um recurso DA CASA
        do token. Pode faltar na corrida rara em que duas edições disputam a
        mesma palavra e o índice único decide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KeywordConflict" }

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ErrorCode:
      type: string
      description: |
        Conjunto fechado. O cliente decide o que fazer **pelo código**, nunca
        pelo texto da mensagem (D4 da spec 0003).

        Os seis `IMPORT_*` são de `POST /imports` e `POST /imports/{id}/confirm`,
        e existem porque cada um mapeia para uma ação diferente da interface — a
        tabela que explica cada um está em `ImportErrorCode`, que é o
        subconjunto devolvido por aquelas rotas.

        `KEYWORD_TAKEN` (409) é de `POST/PATCH /categories` e `/accounts`: a
        tela mostra "já está em *X*" com o `ownerId` — ação diferente do 400 de
        forma, por isso código próprio (D4 da spec 0003).

        `CONFLICT` (409) é de `POST /transfers/detect`, `POST /investments/detect`
        e `POST /ai/keyword-import/confirm`: o estado mudou entre a leitura e a
        escrita da mesma operação, nada foi gravado, e a ação da tela é pedir a
        prévia de novo — diferente do 422 de teto, que não muda com uma nova
        tentativa (ADR-028).
      enum:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - INVALID_CODE
        - EMAIL_NOT_VERIFIED
        - UNAUTHENTICATED
        - INVALID_SESSION
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
        - RESOURCE_IN_USE
        - KEYWORD_TAKEN
        - CONFLICT
        - IMPORT_PASSWORD_REQUIRED
        - IMPORT_PASSWORD_INVALID
        - IMPORT_FORMAT_UNKNOWN
        - IMPORT_FORMAT_AMBIGUOUS
        - IMPORT_TARGET_MISMATCH
        - IMPORT_FILE_REJECTED

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: Mensagem genérica em pt-BR; nunca contém detalhe interno.

    ValidationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              const: VALIDATION_FAILED
            message: { type: string }
            fields:
              type: object
              description: Só existe em VALIDATION_FAILED.
              additionalProperties: { type: string }

    Keyword:
      type: string
      minLength: 2
      maxLength: 40
      pattern: "^[\\p{L}\\p{N} &./'\\-]+$"
      description: |
        Palavra-chave de categoria ou de conta (spec 0005 §4.1). De 2 a 40
        runas depois de normalizada; letras, dígitos, espaço e `& . - / '`.
        Precisa produzir ao menos uma palavra útil depois da tokenização da §3
        — só palavras vazias ("de", "ltda") ou só letras soltas ("c & a") é 400.
        Comparada sem acento e sem caixa; exibida como foi digitada.

        Dica que a tela mostra: prefira o nome do estabelecimento — abaixo de 5
        runas ("pix", "uber") a palavra só casa inteira, nunca por aproximação.

    KeywordConflict:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields]
          properties:
            code:
              type: string
              const: KEYWORD_TAKEN
            message: { type: string }
            fields:
              type: object
              additionalProperties: false
              required: [keyword]
              properties:
                keyword: { $ref: "#/components/schemas/Keyword" }
                ownerId:
                  type: string
                  format: uuid
                  description: Categoria (ou conta) DA CASA que já tem a palavra.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            Argon2id no servidor. Reprovada se for muito comum ou se contiver
            o e-mail ou o nome do titular.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    ResendCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        registrationToken:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Opcional no contrato, indispensável na prática: é o token da
            tentativa de cadastro em curso, devolvido por `POST /auth/register`.

            Sem ele o servidor responde o mesmo 202 (grupo B da §3.12), mas
            **nada é emitido** — quem pede reenvio não apresenta credenciais,
            então qualquer código emitido para ele herdaria as de outra
            pessoa. Quem perdeu o token refaz o cadastro.

            Não está em `required` porque o servidor NÃO recusa o pedido sem
            ele: manter uma única forma de resposta neste endpoint é mais
            barato de auditar do que somar um 400. O gerador de clientes não
            pode prometer uma obrigatoriedade que o servidor não cobra.
            Quando o campo VEM, a forma é cobrada: 64 hexadecimais ou 400.

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code, registrationToken]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Seis dígitos; zeros à esquerda são significativos.
        registrationToken:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Obrigatório. O token devolvido por `POST /auth/register` ou
            `POST /auth/resend-code`. O código só é validado dentro da
            tentativa que este token identifica.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        newPassword: { type: string, minLength: 12, maxLength: 256 }

    VerificationRequired:
      type: object
      additionalProperties: false
      required: [status, email, expiresInSeconds, registrationToken]
      properties:
        status:
          type: string
          const: verification_required
        email:
          type: string
          description: O e-mail enviado na requisição, normalizado.
        expiresInSeconds:
          type: integer
          description: Validade do código.
        registrationToken:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Segredo opaco de 256 bits que identifica ESTA tentativa de
            cadastro. Guarde-o no cliente e envie-o em
            `POST /auth/verify-email`.

            Sozinho não autentica nada: só serve junto do código de 6
            dígitos que foi para a caixa de entrada. Está sempre presente e
            sempre com 64 hexadecimais, em todos os caminhos, para não revelar
            o estado da conta (§3.12, grupos A e B).

    ForgotPasswordAccepted:
      type: object
      additionalProperties: false
      required: [status, message, expiresInSeconds]
      properties:
        status:
          type: string
          const: accepted
        message: { type: string }
        expiresInSeconds: { type: integer }

    HouseholdSummary:
      type: object
      additionalProperties: false
      required: [id, name, role, timezone, currency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        role:
          type: string
          enum: [owner, member]
        timezone:
          type: string
          maxLength: 64
          description: |
            Fuso IANA da casa (ADR-019). O cliente usa ESTE valor, e não o do
            navegador, para saber em que mês ele está: perto da virada do mês,
            o fuso do navegador daria o mês errado. Default
            `America/Sao_Paulo`.
          examples: ["America/Sao_Paulo"]
        currency:
          type: string
          maxLength: 3
          description: |
            Moeda da casa. `BRL` fixo no v1 — o campo existe para que nenhuma
            tela tenha símbolo de moeda escrito à mão.
          examples: ["BRL"]

    UserSummary:
      type: object
      additionalProperties: false
      required: [id, name, email, emailVerifiedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        emailVerifiedAt:
          type: [string, "null"]
          format: date-time
        createdAt: { type: string, format: date-time }

    Me:
      type: object
      additionalProperties: false
      required: [user, household, households]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        household: { $ref: "#/components/schemas/HouseholdSummary" }
        households:
          type: array
          items: { $ref: "#/components/schemas/HouseholdSummary" }

    AccountKind:
      type: string
      description: |
        Conjunto fechado. `credit_card` deixou de ser só um rótulo: o ADR-023
        superou o ADR-019(c) e (d), e a conta de cartão passa a ter fatura
        (`card_statements`), fechamento, vencimento e competência separada de
        caixa.

        O saldo do cartão **não** mudou (ADR-023d): continua sendo a dívida
        corrente — abertura mais a soma de TODOS os lançamentos da conta, sem
        olhar competência. Quem não registrar o pagamento da fatura como
        transferência vê essa dívida crescer para sempre, e a interface tem de
        dizer isso em português.
      enum: [cash, checking, savings, credit_card, other]

    CivilDate:
      type: string
      description: |
        Data civil `AAAA-MM-DD` — sem hora e sem fuso. Não é um instante: o dia
        do calendário não muda quando o servidor muda de fuso (ADR-019a).
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      examples: ["2026-09-12"]

    Account:
      type: object
      additionalProperties: false
      required:
        [id, name, kind, institution, statementClosingDay, statementDueDay,
         openingBalanceCents, openingDate, balanceCents, keywords, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: "#/components/schemas/AccountKind" }
        institution:
          allOf:
            - $ref: "#/components/schemas/Institution"
          description: |
            Instituição da conta. Default `other`. Serve à trava de consistência
            da importação e ao rótulo no seletor de conta — **não escolhe o
            parser** (ADR-024a).
        statementClosingDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: |
            Dia do FECHAMENTO da fatura. Só faz sentido em `credit_card`. Nulo
            significa "não configurado", e nesse caso a importação de fatura
            exige que o usuário confirme as datas no passo de revisão.
        statementDueDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: |
            Dia do VENCIMENTO da fatura. Mesmas regras do fechamento. É o mês
            deste dia que dá a competência da fatura (D2).
        openingBalanceCents:
          type: integer
          format: int64
          description: |
            Saldo no dia em que a conta entrou no app, em CENTAVOS. Pode ser
            negativo (cartão nasce devendo). Float é proibido em toda camada
            (ADR-003).
          minimum: -99999999999
          maximum: 99999999999
        openingDate: { $ref: "#/components/schemas/CivilDate" }
        balanceCents:
          type: integer
          format: int64
          description: |
            Saldo atual, **derivado** (ADR-017): saldo de abertura mais a soma
            dos lançamentos da conta, em CENTAVOS. Nunca é coluna no banco.

            No cartão de crédito é a **dívida corrente** (negativa), somando
            todos os lançamentos sem olhar competência (ADR-023d) — pagar a
            fatura é uma transferência, e é ela que traz o saldo de volta a zero.
        keywords:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            Sempre presente (`[]` quando vazio), na ordem em que foram
            cadastradas. Conta arquivada mantém as palavras, mas elas não
            participam da correspondência.
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Preenchido quando a conta está arquivada.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AccountList:
      type: object
      additionalProperties: false
      required: [items, totalBalanceCents]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        totalBalanceCents:
          type: integer
          format: int64
          description: |
            Soma dos saldos das contas LISTADAS. Vem do servidor de propósito:
            somar centavos também no cliente é criar duas fontes para o mesmo
            número, e elas divergem.

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, kind, openingBalanceCents, openingDate]
      description: |
        `householdId` não existe neste corpo, e mandá-lo é 400: a casa vem do
        token. O mesmo vale para `id`, `balanceCents`, `archivedAt` e
        timestamps — todos derivados no servidor (S2 do PLANOS.md).
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: "#/components/schemas/AccountKind" }
        institution:
          allOf:
            - $ref: "#/components/schemas/Institution"
          description: Ausente = `other`.
        statementClosingDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: |
            Só faz sentido em `credit_card`. Mandá-lo em conta que não é cartão
            é 422.
        statementDueDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
        openingBalanceCents:
          type: integer
          format: int64
          minimum: -99999999999
          maximum: 99999999999
        openingDate: { $ref: "#/components/schemas/CivilDate" }
        keywords:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            Ausente = lista vazia (POST) / não mexe (PATCH). Presente
            **substitui** a lista inteira — `[]` limpa. Repetida na própria
            lista é 400 `fields.keywords[i]`; usada por OUTRA conta da casa é
            409 `KEYWORD_TAKEN`.

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      description: |
        Campos ausentes não são alterados. `statementClosingDay` e
        `statementDueDay` aceitam `null` **explícito** para voltar a "não
        configurado" — é a diferença entre "não mexi" (ausente) e "quero limpar"
        (nulo).
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: "#/components/schemas/AccountKind" }
        institution: { $ref: "#/components/schemas/Institution" }
        statementClosingDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
        statementDueDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
        openingBalanceCents:
          type: integer
          format: int64
          minimum: -99999999999
          maximum: 99999999999
        openingDate: { $ref: "#/components/schemas/CivilDate" }
        keywords:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            Ausente = lista vazia (POST) / não mexe (PATCH). Presente
            **substitui** a lista inteira — `[]` limpa. Repetida na própria
            lista é 400 `fields.keywords[i]`; usada por OUTRA conta da casa é
            409 `KEYWORD_TAKEN`.

    CategoryKind:
      type: string
      description: |
        Natureza da categoria — conjunto **fechado** de quatro valores,
        organizados em dois **lados do dinheiro** (ADR-029):

        | Lado | Naturezas | Lançamento que a aceita |
        |---|---|---|
        | sai da conta | `expense`, `investment` | `expense` |
        | entra na conta | `income`, `redemption` | `income` |

        `investment` é aporte e `redemption` é resgate. Eles **não** criam tipo
        de lançamento novo: o aporte continua sendo dinheiro que sai da conta e
        o saldo não muda. Transferência não tem categoria de natureza nenhuma
        (ADR-016).
      enum: [income, expense, investment, redemption]

    Category:
      type: object
      additionalProperties: false
      required: [id, name, kind, parentId, keywords, archivedAt, createdAt, updatedAt, children]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        parentId:
          type: [string, "null"]
          format: uuid
          description: |
            Nulo = grupo (nível 1). Preenchido = subcategoria (nível 2). Não
            existe nível 3 (ADR-017b).
        keywords:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            Sempre presente (`[]` quando vazio), na ordem em que foram
            cadastradas. Categoria arquivada mantém as palavras, mas elas não
            participam da correspondência.
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        children:
          type: array
          description: |
            Só é preenchido em grupo, e apenas na resposta em árvore. Vem
            sempre como lista (vazia, se não houver) para a tela não precisar
            tratar `null`.
          items: { $ref: "#/components/schemas/Category" }

    CategoryTree:
      type: object
      additionalProperties: false
      required: [income, expense, investment, redemption]
      description: |
        Separado por natureza porque as telas nunca misturam receita, despesa,
        aporte e resgate. Os quatro arrays vêm **sempre presentes** (`[]` quando
        vazios) — a tela não distingue "ausente" de "nenhuma" (ADR-029a).

        O seletor de categoria de um LANÇAMENTO junta os dois arrays do mesmo
        lado do dinheiro: despesa oferece `expense` + `investment`; receita,
        `income` + `redemption`.
      properties:
        income:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        expense:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        investment:
          type: array
          description: Grupos de APORTE. Recebem lançamento de despesa.
          items: { $ref: "#/components/schemas/Category" }
        redemption:
          type: array
          description: Grupos de RESGATE. Recebem lançamento de receita.
          items: { $ref: "#/components/schemas/Category" }

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Grupo: mande `name` e `kind`. Subcategoria: mande `name` e `parentId` —
        a natureza é HERDADA do grupo, e um `kind` enviado junto é ignorado
        (não é erro; o servidor é quem manda nesse campo).
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        parentId:
          type: [string, "null"]
          format: uuid
          description: |
            Precisa apontar para um GRUPO da mesma casa. Apontar para uma
            subcategoria é 422 (não há nível 3); apontar para categoria de
            outra casa é 404, nunca 403 — 403 confirmaria que ela existe.
        keywords:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            Ausente = lista vazia (POST) / não mexe (PATCH). Presente
            **substitui** a lista inteira — `[]` limpa. Repetida na própria
            lista é 400 `fields.keywords[i]`; usada por OUTRA categoria da casa
            é 409 `KEYWORD_TAKEN`. Lista **não vazia** em grupo com subcategoria
            ativa é 400 `fields.keywords` (spec 0005 §12) — `[]` continua
            limpando, e as palavras que um grupo já tinha antes de ganhar
            subcategoria ficam inertes, mas continuam na resposta.

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      description: |
        `parentId` não existe aqui: mover categoria de grupo não é uma operação
        do v1, e mandá-lo é 400.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind:
          allOf:
            - $ref: "#/components/schemas/CategoryKind"
          description: |
            Só aceito em **grupo** — a subcategoria herda a natureza do grupo
            (ADR-017b), e mandar `kind` numa folha é 422 em `fields.kind`.

            **Dentro do mesmo lado do dinheiro** (`expense ↔ investment`,
            `income ↔ redemption`) a troca é aceita mesmo com a categoria **em
            uso** e mesmo com subcategorias: nenhum lançamento muda de sinal,
            de conta ou de saldo, e todos continuam válidos contra o pareamento
            — a troca é de rótulo de intenção, não de fato financeiro. Quando o
            grupo tem filhas, elas **acompanham** a troca (ativas e arquivadas)
            na mesma transação (ADR-029c).

            **Cruzar o lado** (`expense ↔ income`) continua recusado com 422 em
            `fields.kind` sempre que o grupo tiver filhas ou uso: transformaria
            despesa registrada em receita e alteraria meses já fechados.

            ⚠️ Efeito declarado da troca permitida: receita e despesa dos meses
            passados **mudam de valor** no instante em que ela acontece, porque
            os lançamentos saem das agregações (ADR-029e). A operação é
            explícita e auditada com autor.
        keywords:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            Ausente = lista vazia (POST) / não mexe (PATCH). Presente
            **substitui** a lista inteira — `[]` limpa. Repetida na própria
            lista é 400 `fields.keywords[i]`; usada por OUTRA categoria da casa
            é 409 `KEYWORD_TAKEN`. Lista **não vazia** em grupo com subcategoria
            ativa é 400 `fields.keywords` (spec 0005 §12) — `[]` continua
            limpando, e as palavras que um grupo já tinha antes de ganhar
            subcategoria ficam inertes, mas continuam na resposta.

    YearMonth:
      type: string
      description: |
        Mês civil `AAAA-MM`, sem dia, sem hora e sem fuso. É o "mês do app" —
        sempre **competência** (ADR-023c), nunca caixa, em listagem, painel,
        orçamento e relatório.
      pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
      examples: ["2026-09"]

    TransactionCursor:
      type: string
      description: |
        Cursor opaco de paginação — `base64url(occurredOn|id)`. É devolvido pelo
        servidor e reenviado **sem alteração**; o cliente não o constrói nem o
        interpreta.

        Não é assinado, e não precisa ser: ele não carrega autorização nenhuma —
        a casa vem sempre do token. É validado estritamente (data civil mais
        forma de UUID), e o que não passar é **400 sem detalhe** (S5 do
        PLANOS.md).
      pattern: "^[A-Za-z0-9_-]{1,256}$"

    TransactionKind:
      type: string
      description: |
        Conjunto fechado. `amountCents` é sempre não-negativo: **o sinal vem
        daqui**, nunca do valor. `transfer_out`/`transfer_in` só existem aos
        pares, com o mesmo `transferGroupId` (ADR-016), e nunca têm categoria.
      enum: [income, expense, transfer_out, transfer_in]

    TransactionKindGroup:
      type: string
      description: |
        **Agrupamento** de tipos usado pelo filtro de `GET /transactions`
        (spec 0004 §1.6, emenda E2d de 18/09/2026). Allowlist **fechada** e
        **sensível a caixa**; a ausência da chave — ou a string vazia — é
        **Tudo**.

        Os quatro predicados, um a um:

        - `income` — `kind = income` cuja categoria **não** é de natureza
          `investment`/`redemption` (lançamento sem categoria entra);
        - `expense` — `kind = expense` cuja categoria **não** é de natureza
          `investment`/`redemption` (lançamento sem categoria entra);
        - `transfer` — `kind` em (`transfer_out`, `transfer_in`). As **duas**
          pernas do par, cada uma como uma linha da lista (ADR-016);
        - `investment` — `kind` em (`income`, `expense`) **com** categoria de
          natureza `investment`/`redemption`. Casa que não marca nenhuma
          categoria recebe lista vazia, não erro.

        `income`/`expense` **excluem** aporte e resgate; `investment` é o
        conjunto complementar. Não confundir com `TransactionKind`: este é um
        **agrupamento** sobre ele, e `investment` não é um `kind` (ADR-029b).

        Os quatro grupos **particionam** a janela: a soma dos quatro `count` é
        o `count` de Tudo, sem sobra e sem repetição.

        Valor fora da lista — inclusive `all`, `EXPENSE`, `transfer_out` e
        `redemption` — é **400** em `fields.kindGroup`. A mensagem cita a
        allowlist e **nunca repete o valor recebido**, nem na resposta nem no
        log.
      enum: [income, expense, transfer, investment]

    TransactionSource:
      type: string
      description: |
        Origem do lançamento. `import` significa que ele veio de um lote, e
        `importBatchId` aponta para qual — é essa coluna, e não 10.000 linhas de
        auditoria, que dá a rastreabilidade por lançamento (spec 0004 §6.10).
      enum: [manual, import]

    Transaction:
      type: object
      additionalProperties: false
      required:
        [id, kind, accountId, accountName, categoryId, categoryName, amountCents, description,
         occurredOn, yearMonth, competenceMonth, transferGroupId, statementId, source,
         importBatchId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        accountId: { type: string, format: uuid }
        accountName: { type: string, maxLength: 80 }
        categoryId:
          type: [string, "null"]
          format: uuid
          description: |
            **Anulável.** Lançamento importado nasce **sem categoria** (spec 0004
            §3.4, D3): obrigar a escolher categoria em 300 linhas antes de
            confirmar mataria o fluxo, e semear uma categoria "A classificar"
            poluiria a taxonomia do usuário com uma categoria falsa que depois
            não se apaga porque está em uso.

            Transferência **nunca** tem categoria. A tela precisa saber desenhar
            o estado "sem categoria" — `uncategorizedCount` no `summary` é o
            gancho da chamada "N lançamentos sem categoria".
        categoryName:
          type: [string, "null"]
          maxLength: 60
        amountCents:
          type: integer
          format: int64
          description: |
            Valor em **CENTAVOS**, sempre não-negativo — o sinal vem do `kind`.
            Float é proibido em toda camada (ADR-003), e um `number` de ponto
            flutuante aqui seria a porta de entrada dele no frontend.
          minimum: 0
          maximum: 99999999999
        description:
          type: string
          maxLength: 140
          description: |
            Já **sanitizada** na importação (spec 0004 §6.8) e truncada em 140:
            sem caractere de controle, sem BOM, sem zero-width e sem os
            overrides de direção Unicode (o truque "Trojan Source", que faria a
            descrição exibir um estabelecimento e guardar outro). Identificadores
            numéricos de terceiros (CPF mascarado, CNPJ, agência, conta) são
            removidos; o nome da contraparte é mantido.

            Pode ser vazia. É renderizada como **texto** — `dangerouslySetInnerHTML`
            continua proibido.
        occurredOn: { $ref: "#/components/schemas/CivilDate" }
        yearMonth:
          allOf:
            - $ref: "#/components/schemas/YearMonth"
          description: |
            Mês de **caixa**, derivado de `occurredOn`. Gravado sempre e
            disponível, mas nenhuma tela do v1 o usa — o mês do app é
            `competenceMonth` (ADR-023c).
        competenceMonth:
          allOf:
            - $ref: "#/components/schemas/YearMonth"
          description: |
            Mês de **competência**. Igual ao `yearMonth` fora de fatura; igual ao
            mês da fatura dentro dela. É por ele que `GET /transactions?month=`
            filtra.
        transferGroupId:
          type: [string, "null"]
          format: uuid
          description: |
            Preenchido nas duas pernas de uma transferência (ADR-016). Excluir
            uma perna exclui o par inteiro.
        statementId:
          type: [string, "null"]
          format: uuid
          description: Fatura de cartão a que a linha pertence, quando houver.
        source: { $ref: "#/components/schemas/TransactionSource" }
        importBatchId:
          type: [string, "null"]
          format: uuid
          description: Lote de origem. Nulo em lançamento manual.
        createdBy:
          type: string
          format: uuid
          description: Quem lançou ou quem confirmou o lote.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TransactionSummary:
      type: object
      additionalProperties: false
      required:
        [incomeCents, expenseCents, netCents, count, uncategorizedCount,
         investedCents, redeemedCents]
      description: |
        Totais **do mesmo filtro** da listagem, calculados no servidor. Vêm no
        mesmo payload de propósito: somar centavos também no cliente criaria
        duas fontes para o mesmo número, e elas divergem. Transferência não
        entra em receita nem em despesa (ADR-016).

        **Aporte e resgate também não entram** (ADR-029e): o lançamento cuja
        categoria é de natureza `investment` sai de `expenseCents` e entra em
        `investedCents`; o de natureza `redemption` sai de `incomeCents` e entra
        em `redeemedCents`. É a MESMA linha, contada uma vez só — `count` e
        `uncategorizedCount` não mudam, a lista continua mostrando o lançamento
        e o saldo da conta continua descontado. A tela é **obrigada** a mostrar
        os dois números quando forem maiores que zero: um total que encolhe sem
        explicação é mentira por omissão.

        ### Sob `kindGroup` (emenda E2d)

        O resumo responde ao MESMO recorte da lista, com **uma exceção
        declarada**: `investedCents` e `redeemedCents` são **invariantes** ao
        `kindGroup` — o mesmo valor volta nas cinco opções. Eles não descrevem
        a janela; descrevem o que **saiu** de `expenseCents`/`incomeCents`
        (ADR-029e), e é deles que vive a frase "Fora destes números: R$ X em
        aportes" (spec 0006 §3.5.2). Zerá-los sob `?kindGroup=expense`
        apagaria a explicação exatamente onde a omissão é maior.

        | `kindGroup` | `count` | `incomeCents` | `expenseCents` | `uncategorizedCount` | `investedCents` / `redeemedCents` |
        |---|---|---|---|---|---|
        | ausente (**Tudo**) | a janela inteira, transferências inclusive | receitas, já sem os resgates | despesas, já sem os aportes | receitas e despesas sem categoria | **inalterado** |
        | `income` | receitas, **sem** os resgates | idem acima | `0` | receitas sem categoria | **inalterado** |
        | `expense` | despesas, **sem** os aportes | `0` | idem acima | despesas sem categoria | **inalterado** |
        | `transfer` | as duas pernas do par | `0` | `0` | `0` | **inalterado** |
        | `investment` | aportes + resgates | `0` | `0` | `0` | **inalterado** |

        `uncategorizedCount` é `0` sob `transfer` **por desenho**: transferência
        não tem categoria (ADR-016), e contá-la como pendência pediria que a
        pessoa categorizasse o que não tem categoria para receber. Sob
        `investment` também é `0`: aporte e resgate têm categoria por definição
        — é ela que os marca.

        Os números dos quatro grupos saem de **uma única** leitura da janela,
        dobrada no servidor; não são cinco consultas, justamente para que não
        possam discordar entre si.
      properties:
        incomeCents: { type: integer, format: int64, minimum: 0 }
        expenseCents:
          type: integer
          format: int64
          minimum: 0
          description: Soma das despesas, em módulo — o sinal está no `kind`.
        netCents:
          type: integer
          format: int64
          description: |
            `incomeCents - expenseCents`, **sempre** — a identidade vale nas
            cinco opções de `kindGroup` e é verificada no servidor antes de
            publicar. Pode ser negativo.

            Segue o `kindGroup`, como os dois operandos dele. Sob recorte de um
            lado só, isso o torna **redundante ou espelhado**, e é assim de
            propósito: com `income` ele é o próprio `incomeCents`; com `expense`
            é `-expenseCents`; com `transfer` e `investment` é `0`, porque
            receita e despesa são zero nesses grupos. Nesses casos ele não
            acrescenta informação, e a tela não o exibe.

            **Não é "o resultado do mês".** Quem quer o resultado do mês pede
            sem `kindGroup` — fazê-lo ignorar o recorte quebraria a identidade
            acima dentro do mesmo payload, e um campo que contradiz a própria
            fórmula é pior do que um campo redundante.
        investedCents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Soma dos **aportes** do filtro: lançamentos `expense` com categoria
            de natureza `investment`. Sempre presente; `0` quando a casa não tem
            categoria de investimento (ADR-029d).
        redeemedCents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Soma dos **resgates** do filtro: lançamentos `income` com categoria
            de natureza `redemption`. Sempre presente.
        count: { type: integer, minimum: 0 }
        uncategorizedCount:
          type: integer
          minimum: 0
          description: |
            Quantos lançamentos do filtro estão **sem categoria** (D3). Sem este
            número a consequência aceita da D3 vira dívida invisível.

    TransactionList:
      type: object
      additionalProperties: false
      required: [items, nextCursor, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/TransactionCursor"
            - type: "null"
          description: |
            Nulo quando não há mais página. Vem sempre presente (nulo, se for o
            caso) para a tela não precisar distinguir "ausente" de "acabou".
        summary: { $ref: "#/components/schemas/TransactionSummary" }

    UpdateTransactionCategoryRequest:
      type: object
      additionalProperties: false
      required: [categoryId]
      description: |
        Corpo de `PATCH /transactions/{id}` na emenda §11 da spec 0005. Um
        campo só, obrigatório e sem `null`: a emenda troca categoria, não a
        remove. Campo a mais é 400.
      properties:
        categoryId:
          type: string
          format: uuid
          description: |
            Categoria **ativa** da casa, da mesma natureza do lançamento
            (`income` ↔ receita, `expense` ↔ despesa). De outra casa é 404;
            arquivada, de natureza trocada ou **grupo com subcategoria ativa**
            (emenda §13) é 422.

    AutoCategorizeRequest:
      type: object
      additionalProperties: false
      required: [month, dryRun]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        dryRun:
          type: boolean
          description: |
            Obrigatório, sem default: ausente é 400. `true` só calcula; `false`
            grava. O default implícito seria "gravar", e é justamente o que não
            pode acontecer por um campo esquecido.

    AutoCategorizeUnmatchedReason:
      type: string
      description: |
        `below_threshold` — a melhor pontuação ficou abaixo de 80 (ou não há
        palavra-chave nenhuma); `ambiguous` — duas categorias diferentes
        empataram na pontuação máxima, e ambíguo é pior que vazio em dado
        financeiro.
      enum: [below_threshold, ambiguous]

    AutoCategorizeItem:
      type: object
      additionalProperties: false
      required: [id, description, categoryId, categoryName, matchScore, matchedKeyword]
      properties:
        id: { type: string, format: uuid }
        description: { type: string, maxLength: 140 }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, maxLength: 60 }
        matchScore: { type: integer, minimum: 80, maximum: 100 }
        matchedKeyword: { $ref: "#/components/schemas/Keyword" }

    AutoCategorizeUnmatchedItem:
      type: object
      additionalProperties: false
      required: [id, description, reason]
      properties:
        id: { type: string, format: uuid }
        description: { type: string, maxLength: 140 }
        reason: { $ref: "#/components/schemas/AutoCategorizeUnmatchedReason" }

    AutoCategorizeResult:
      type: object
      additionalProperties: false
      required: [month, categorized, unmatched, items, unmatchedItems]
      description: |
        Em `dryRun`, `categorized` é quantos receberiam categoria e as listas
        vêm preenchidas (teto de 500 cada; as contagens são sempre completas).
        Na execução real, `categorized` é o número de linhas **afetadas** pelo
        `UPDATE` condicional e as listas vêm vazias.
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        categorized: { type: integer, minimum: 0 }
        unmatched: { type: integer, minimum: 0 }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/AutoCategorizeItem" }
        unmatchedItems:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/AutoCategorizeUnmatchedItem" }

    TransferItem:
      type: object
      additionalProperties: false
      required:
        [groupId, occurredOn, competenceMonth, fromAccountId, fromAccountName, toAccountId,
         toAccountName, amountCents, description, source]
      description: Um PAR de transferência (ADR-016) visto como uma linha só.
      properties:
        groupId: { type: string, format: uuid, description: "`transferGroupId` das duas pernas." }
        occurredOn: { $ref: "#/components/schemas/CivilDate" }
        competenceMonth: { $ref: "#/components/schemas/YearMonth" }
        fromAccountId: { type: string, format: uuid, description: "Conta da perna `transfer_out`." }
        fromAccountName: { type: string, maxLength: 80 }
        toAccountId: { type: string, format: uuid, description: "Conta da perna `transfer_in`." }
        toAccountName: { type: string, maxLength: 80 }
        amountCents: { type: integer, format: int64, minimum: 0, maximum: 99999999999 }
        description: { type: string, maxLength: 140 }
        source: { $ref: "#/components/schemas/TransactionSource" }

    TransferPair:
      type: object
      additionalProperties: false
      required:
        [accountAId, accountAName, accountBId, accountBName, aToBCents, bToACents, netCents, count]
      description: |
        Totais do MÊS INTEIRO entre duas contas, somados no servidor. `A` é a
        conta de menor id, para o par ser identificável independente do sentido.
        `netCents = aToBCents − bToACents`: positivo quer dizer "A enviou mais
        para B"; a tela escreve a direção em texto, nunca só o sinal.
      properties:
        accountAId: { type: string, format: uuid }
        accountAName: { type: string, maxLength: 80 }
        accountBId: { type: string, format: uuid }
        accountBName: { type: string, maxLength: 80 }
        aToBCents: { type: integer, format: int64, minimum: 0 }
        bToACents: { type: integer, format: int64, minimum: 0 }
        netCents: { type: integer, format: int64 }
        count: { type: integer, minimum: 0 }

    TransferBalance:
      type: object
      additionalProperties: false
      required: [accountId, accountName, balanceAtMonthEndCents]
      properties:
        accountId: { type: string, format: uuid }
        accountName: { type: string, maxLength: 80 }
        balanceAtMonthEndCents:
          type: integer
          format: int64
          description: |
            Saldo de **caixa** no último dia do mês: abertura mais a soma com
            sinal de todos os lançamentos vivos com `occurredOn` ≤ esse dia
            (ADR-017). Igual a `balanceCents` de `GET /accounts` quando o mês é
            o corrente e não há lançamento datado depois dele.

    TransferList:
      type: object
      additionalProperties: false
      required: [items, pairs, balances, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TransferItem" }
        pairs:
          type: array
          items: { $ref: "#/components/schemas/TransferPair" }
        balances:
          type: array
          items: { $ref: "#/components/schemas/TransferBalance" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/TransactionCursor"
            - type: "null"

    TransferDetectRequest:
      type: object
      additionalProperties: false
      required: [month, dryRun]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        dryRun:
          type: boolean
          description: |
            Obrigatório, sem default: ausente é 400. `true` só calcula; `false`
            converte. O default implícito seria "converter", e é justamente o
            que não pode acontecer por um campo esquecido.

    TransferDetectUnpairedReason:
      type: string
      description: |
        `no_mirror` — a descrição bate com palavra-chave de conta, mas não há,
        em outra conta ativa da casa, um lançamento vivo de sentido oposto,
        mesmo valor e `occurredOn` a ±3 dias que ainda esteja livre (e, quando
        a palavra é da própria conta, que também bata com palavra-chave). O
        servidor **nunca** cria a perna que falta. Único valor nesta emenda;
        enum fechado para a tela escolher a frase pelo código.
      enum: [no_mirror]

    TransferDetectItem:
      type: object
      additionalProperties: false
      required:
        [outTransactionId, inTransactionId, occurredOn, fromAccountId, fromAccountName,
         toAccountId, toAccountName, amountCents, description, matchedKeyword, matchScore]
      description: |
        Um par que seria (prévia) convertido em transferência: a `expense` vira
        a perna de saída e a `income` a de entrada. `occurredOn` e
        `description` são os da perna de **saída** — o que `GET /transfers`
        vai mostrar depois da conversão; `matchedKeyword` e `matchScore`
        descrevem a **candidata que decidiu** (pode ser qualquer uma das duas
        pernas).
      properties:
        outTransactionId: { type: string, format: uuid, description: "O lançamento `expense` que vira `transfer_out`." }
        inTransactionId: { type: string, format: uuid, description: "O lançamento `income` que vira `transfer_in`." }
        occurredOn: { $ref: "#/components/schemas/CivilDate" }
        fromAccountId: { type: string, format: uuid, description: "Conta da perna de saída." }
        fromAccountName: { type: string, maxLength: 80 }
        toAccountId: { type: string, format: uuid, description: "Conta da perna de entrada." }
        toAccountName: { type: string, maxLength: 80 }
        amountCents: { type: integer, format: int64, minimum: 0, maximum: 99999999999 }
        description: { type: string, maxLength: 140 }
        matchedKeyword: { $ref: "#/components/schemas/Keyword" }
        matchScore: { type: integer, minimum: 80, maximum: 100 }

    TransferDetectUnpairedItem:
      type: object
      additionalProperties: false
      required:
        [id, kind, accountId, accountName, occurredOn, amountCents, description,
         matchedKeyword, reason]
      description: |
        Uma candidata que **continua como está**: bate com palavra-chave de
        conta, mas não tem a outra perna gravada. Nada é feito com ela.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [income, expense]
          description: Só receita e despesa são candidatas; perna de transferência nunca.
        accountId: { type: string, format: uuid }
        accountName: { type: string, maxLength: 80 }
        occurredOn: { $ref: "#/components/schemas/CivilDate" }
        amountCents: { type: integer, format: int64, minimum: 0, maximum: 99999999999 }
        description: { type: string, maxLength: 140 }
        matchedKeyword: { $ref: "#/components/schemas/Keyword" }
        reason: { $ref: "#/components/schemas/TransferDetectUnpairedReason" }

    TransferDetectResult:
      type: object
      additionalProperties: false
      required: [month, paired, unpaired, items, unpairedItems]
      description: |
        Em `dryRun`, `paired` é quantos pares **seriam** convertidos e as listas
        vêm preenchidas (teto de 500 cada; as contagens são sempre completas).
        Na execução real, `paired` é o número de pares **convertidos** — cada um
        conferido com duas linhas afetadas — e as listas vêm vazias. `unpaired`
        conta candidatas sem espelho, nos dois modos.

        Os dois conjuntos são **disjuntos**: um lançamento que entra num par
        nunca aparece em `unpairedItems`, e cada lançamento participa de no
        máximo um par. A tela pode somar `paired` e `unpaired` sem medo de
        contar a mesma linha duas vezes.
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        paired: { type: integer, minimum: 0 }
        unpaired: { type: integer, minimum: 0 }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/TransferDetectItem" }
        unpairedItems:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/TransferDetectUnpairedItem" }

    InvestmentFlow:
      type: string
      description: |
        O que o dinheiro fez. Derivado do `kind` do LANÇAMENTO, nunca da
        natureza da categoria (ADR-029d): `expense` → `contribution` (aporte,
        dinheiro que saiu da conta), `income` → `redemption` (resgate, dinheiro
        que entrou). Enum fechado.
      enum: [contribution, redemption]

    InvestmentTotals:
      type: object
      additionalProperties: false
      required: [contributionsCents, contributionCount, redemptionsCents, redemptionCount]
      description: |
        Os quatro números de uma janela. **Não existe líquido nem saldo aqui**:
        aporte menos resgate não é patrimônio, e publicar essa subtração
        convidaria a lê-la como tal (spec 0006 §2.2).
      properties:
        contributionsCents: { type: integer, format: int64, minimum: 0 }
        contributionCount: { type: integer, minimum: 0 }
        redemptionsCents: { type: integer, format: int64, minimum: 0 }
        redemptionCount: { type: integer, minimum: 0 }

    InvestmentSeriesPoint:
      type: object
      additionalProperties: false
      required: [month, contributionsCents, redemptionsCents]
      description: Um mês da série. Mês sem movimento vem com zeros, nunca ausente.
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        contributionsCents: { type: integer, format: int64, minimum: 0 }
        redemptionsCents: { type: integer, format: int64, minimum: 0 }

    InvestmentItem:
      type: object
      additionalProperties: false
      required:
        [id, occurredOn, flow, accountId, accountName, categoryId, categoryName,
         amountCents, description, source]
      description: |
        Um lançamento marcado, do mês selecionado. `categoryId` e `categoryName`
        são **obrigatórios**: sem categoria o lançamento não estaria aqui.
      properties:
        id: { type: string, format: uuid }
        occurredOn: { $ref: "#/components/schemas/CivilDate" }
        flow: { $ref: "#/components/schemas/InvestmentFlow" }
        accountId: { type: string, format: uuid }
        accountName: { type: string, maxLength: 80 }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, maxLength: 60 }
        amountCents: { type: integer, format: int64, minimum: 0, maximum: 99999999999 }
        description: { type: string, maxLength: 140 }
        source: { $ref: "#/components/schemas/TransactionSource" }

    InvestmentOverview:
      type: object
      additionalProperties: false
      required: [month, monthly, yearToDate, series, items, nextCursor]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        monthly: { $ref: "#/components/schemas/InvestmentTotals" }
        yearToDate:
          allOf:
            - $ref: "#/components/schemas/InvestmentTotals"
          description: |
            De 1º de janeiro do ano de `month` até `month`, inclusive. Ano civil
            da casa; não é "últimos 12 meses".
        series:
          type: array
          minItems: 12
          maxItems: 12
          description: |
            **Sempre 12 itens**, em ordem cronológica crescente, terminando em
            `month`. O cliente não escolhe o tamanho.
          items: { $ref: "#/components/schemas/InvestmentSeriesPoint" }
        items:
          type: array
          items: { $ref: "#/components/schemas/InvestmentItem" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/TransactionCursor"
            - type: "null"

    InvestmentDetectRequest:
      type: object
      additionalProperties: false
      required: [month, dryRun]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        dryRun:
          type: boolean
          description: |
            Obrigatório, sem default: ausente é 400. `true` só calcula; `false`
            grava. O default implícito seria "gravar", e é justamente o que não
            pode acontecer por um campo esquecido.
        overwriteCategorized:
          type: boolean
          default: false
          description: |
            Ausente é `false`, e o ausente é o **seguro**: sem ele, lançamento
            que já tem categoria nunca é alterado. Com `true`, a categoria de
            natureza `income`/`expense` é substituída pela de investimento —
            e **só ela**: marcação de investimento anterior nunca é desfeita
            (a restrição está no `WHERE`, não na tela). Vale nos dois modos: em
            `dryRun` ele muda o que a prévia **promete**, e a promessa e a
            escrita têm de ser calculadas do mesmo jeito.

    InvestmentDetectUnmatchedReason:
      type: string
      description: |
        Por que o lançamento **continua sem marca de investimento**:

        - `below_threshold` — a melhor pontuação ficou abaixo de 80, ou a casa
          não tem palavra-chave que sirva;
        - `ambiguous` — duas categorias diferentes empataram na pontuação
          máxima, e ambíguo é pior que vazio em dado financeiro;
        - `other_category` — houve vencedora, mas ela é de natureza `income` ou
          `expense`: este lançamento não é aporte nem resgate, e quem o
          categoriza é `POST /transactions/auto-categorize`.

        `other_category` existe porque dizer `below_threshold` nesse caso seria
        mentira na tela: a pessoa veria "não bateu com nada" para uma linha que
        bateu com "Mercado" a 100.
      enum: [below_threshold, ambiguous, other_category]

    InvestmentDetectItem:
      type: object
      additionalProperties: false
      required: [id, description, categoryId, categoryName, flow, matchScore, matchedKeyword]
      description: Um lançamento SEM categoria que recebe (ou receberia) categoria de investimento.
      properties:
        id: { type: string, format: uuid }
        description: { type: string, maxLength: 140 }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, maxLength: 60 }
        flow: { $ref: "#/components/schemas/InvestmentFlow" }
        matchScore: { type: integer, minimum: 80, maximum: 100 }
        matchedKeyword: { $ref: "#/components/schemas/Keyword" }

    InvestmentDetectUnmatchedItem:
      type: object
      additionalProperties: false
      required: [id, description, reason]
      properties:
        id: { type: string, format: uuid }
        description: { type: string, maxLength: 140 }
        reason: { $ref: "#/components/schemas/InvestmentDetectUnmatchedReason" }

    InvestmentDetectAlreadyCategorizedItem:
      type: object
      additionalProperties: false
      required:
        [id, description, currentCategoryId, currentCategoryName, categoryId,
         categoryName, flow, matchScore]
      description: |
        Um lançamento que **já tem** categoria e que bateria numa palavra-chave
        de investimento. Sem `overwriteCategorized` ele **não é alterado** — a
        lista existe para a pessoa decidir, não para prometer mudança.
        `currentCategory*` é a categoria de hoje (pode estar arquivada);
        `category*` é a que ele receberia.
      properties:
        id: { type: string, format: uuid }
        description: { type: string, maxLength: 140 }
        currentCategoryId: { type: string, format: uuid }
        currentCategoryName: { type: string, maxLength: 60 }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, maxLength: 60 }
        flow: { $ref: "#/components/schemas/InvestmentFlow" }
        matchScore: { type: integer, minimum: 80, maximum: 100 }

    InvestmentDetectResult:
      type: object
      additionalProperties: false
      required:
        [month, marked, unmatched, alreadyCategorized, items, unmatchedItems,
         alreadyCategorizedItems]
      description: |
        Em `dryRun`, `marked` é quantos **receberiam** categoria de investimento
        e as três listas vêm preenchidas (teto de 500 cada; as contagens são
        sempre completas). Na execução real, `marked` é o número de linhas
        **afetadas** pelo `UPDATE` condicional e as listas vêm vazias.

        Os três conjuntos são **disjuntos**, e cada um responde a uma pergunta
        diferente:

        - `marked` + `unmatched` cobrem **exatamente** os lançamentos SEM
          categoria do mês — a soma dos dois é o total de linhas sem categoria;
        - `alreadyCategorized` conta **só** os que já têm categoria de natureza
          `income`/`expense` **e** bateriam numa palavra-chave de investimento —
          isto é, os que a flag conseguiria trocar.

        O que **não** aparece em lugar nenhum: o lançamento já marcado com
        categoria de investimento (não há o que decidir — e oferecê-lo seria
        prometer uma troca que o `WHERE` recusa) e o lançamento categorizado que
        não bate com palavra-chave de investimento (não é assunto desta tela).

        Com `overwriteCategorized: true`, o conjunto de `alreadyCategorized`
        migra **inteiro** para `marked` e para `items`, e `alreadyCategorized`
        volta 0: a prévia diz exatamente o que a escrita fará, nem mais nem
        menos.
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        marked: { type: integer, minimum: 0 }
        unmatched: { type: integer, minimum: 0 }
        alreadyCategorized:
          type: integer
          minimum: 0
          description: |
            Quantos lançamentos com categoria de natureza `income`/`expense`
            bateriam numa palavra-chave de investimento e **não** foram tocados.
            Sempre 0 quando `overwriteCategorized` é `true` (eles entram em
            `marked`). Lançamento que **já tem** categoria de investimento não
            entra nesta conta: não há troca a oferecer.
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/InvestmentDetectItem" }
        unmatchedItems:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/InvestmentDetectUnmatchedItem" }
        alreadyCategorizedItems:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/InvestmentDetectAlreadyCategorizedItem" }

    BasisPoints:
      type: integer
      minimum: 0
      maximum: 10000
      description: Participação em pontos-base (1 bp = 0,01 %). Inteiro — nunca `number`.

    CategoryReportChild:
      type: object
      additionalProperties: false
      required: [categoryId, name, archivedAt, totalCents, count, shareBp]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        archivedAt:
          type: [string, "null"]
          format: date-time
        totalCents: { type: integer, format: int64, minimum: 0 }
        count: { type: integer, minimum: 1 }
        shareBp: { $ref: "#/components/schemas/BasisPoints" }

    CategoryReportGroup:
      type: object
      additionalProperties: false
      required:
        [categoryId, name, archivedAt, totalCents, count, shareBp,
         directCents, directCount, directShareBp, children]
      description: |
        Um grupo (nível 1) ou o balde "Sem categoria" (`categoryId` e `name`
        nulos, `children` vazio, `direct* == total*`).
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
        name:
          type: [string, "null"]
          maxLength: 60
        archivedAt:
          type: [string, "null"]
          format: date-time
        totalCents: { type: integer, format: int64, minimum: 0 }
        count: { type: integer, minimum: 1 }
        shareBp: { $ref: "#/components/schemas/BasisPoints" }
        directCents:
          type: integer
          format: int64
          minimum: 0
          description: Lançado diretamente no grupo, sem subcategoria.
        directCount: { type: integer, minimum: 0 }
        directShareBp: { $ref: "#/components/schemas/BasisPoints" }
        children:
          type: array
          items: { $ref: "#/components/schemas/CategoryReportChild" }

    CategoryReport:
      type: object
      additionalProperties: false
      required: [month, kind, accountGroup, totalCents, count, items]
      properties:
        month: { $ref: "#/components/schemas/YearMonth" }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        accountGroup:
          type: [string, "null"]
          enum: [credit, debit, null]
          description: |
            O recorte de contas pedido, ecoado — sempre presente. `null` =
            todas as contas. `credit` = lançamentos em conta de tipo
            `credit_card` (arquivada incluída); `debit` = o complemento — toda
            conta que não é cartão de crédito. Para o mesmo `month` e `kind`:
            `total(credit) + total(debit) == total(null)`, e o mesmo vale para
            `count` e para cada `items[].totalCents` (ADR-032).
        totalCents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Sem `accountGroup`: igual a `summary.expenseCents` (ou
            `incomeCents`) de `GET /transactions?month=` no mesmo mês. Com
            `kind=expense&accountGroup=credit`: igual a `creditCardExpenseCents`
            de `GET /dashboard?month=` — o mesmo conjunto de contas e o mesmo
            descarte de aportes (ADR-029e).
        count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/CategoryReportGroup" }

    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        [month, incomeCents, incomeCount, creditCardExpenseCents,
         creditCardExpenseCount, investmentNetCents, investmentCount,
         creditCardAccountCount, investmentCategoryCount]
      description: |
        A faixa de resumo do painel (spec 0008). Todos os campos são
        obrigatórios e sempre presentes: mês vazio devolve zeros, e um número
        ausente faria a tela ter de inventar o que mostrar.

        Este schema é o ponto de crescimento da E4 (`PLANOS.md` §7.4): saldo por
        conta, próximos vencimentos, top categorias e comparação com o mês
        anterior entram aqui como campos novos, no mesmo pedido, sem rota nova.
      properties:
        month:
          allOf:
            - $ref: "#/components/schemas/YearMonth"
          description: O mês pedido, devolvido de volta. Nunca normalizado.
        incomeCents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Receitas vivas da competência **menos** os resgates marcados.
            Idêntico ao `summary.incomeCents` de `GET /transactions?month=` no
            mesmo mês — o número nasce do mesmo predicado e da mesma janela.
        incomeCount:
          type: integer
          minimum: 0
          description: Quantas linhas formam `incomeCents` (já sem os resgates).
        creditCardExpenseCents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Despesas vivas da competência em contas `credit_card` — **todos os
            cartões num número só** —, menos os aportes lançados em cartão.
            Cartão arquivado continua contando.
        creditCardExpenseCount:
          type: integer
          minimum: 0
          description: Quantas linhas formam `creditCardExpenseCents`.
        investmentNetCents:
          type: integer
          format: int64
          description: |
            **Aportes − resgates da competência, COM SINAL.** É negativo no mês
            em que se resgatou mais do que se aportou, e isso é resposta, não
            erro: por isso este campo **não tem `minimum`** — é, ao lado do saldo
            de conta, um dos pouquíssimos campos de dinheiro do contrato sem
            `minimum: 0`, e a omissão é deliberada (ADR-031c).

            Apurado no **servidor**, na mesma consulta agregada que produz os
            dois lados: o cliente formata, nunca subtrai (ADR-003, ADR-027c).

            ⚠️ O schema `InvestmentTotals` de `GET /investments` **continua sem
            líquido** (spec 0006 §2.2): lá a pergunta é "quanto entrou e quanto
            saiu", aqui é "quanto ficou investido neste mês". Duas perguntas,
            dois números, nenhum deles calculado no cliente.
        investmentCount:
          type: integer
          minimum: 0
          description: Aportes + resgates que formam o líquido (soma, não diferença).
        creditCardAccountCount:
          type: integer
          minimum: 0
          description: |
            Contas `credit_card` **vivas e não arquivadas** da casa. Zero é
            "não há cartão cadastrado" — estado diferente de "há cartão e o mês
            não teve gasto", que é `creditCardExpenseCents: 0` com este contador
            maior que zero. A tela precisa dos dois para não mentir.
        investmentCategoryCount:
          type: integer
          minimum: 0
          description: |
            Categorias de natureza `investment`/`redemption` da casa,
            **arquivadas incluídas** — é o mesmo conjunto que marca os
            lançamentos (ADR-029d). Zero é "esta casa ainda não marca
            investimento".

    Institution:
      type: string
      description: |
        Instituição financeira. Allowlist fechada: nada de texto livre aqui.

        **Ela não escolhe o parser da importação** — quem escolhe é a detecção
        por cabeçalho (ADR-024a). Se escolhesse, conta marcada `other` ficaria
        sem importação e conta marcada errado importaria com o parser errado
        **em silêncio**, invertendo o sinal de uma fatura inteira. Aqui ela é
        **trava de consistência**: instituição detectada diferente da da conta é
        422 `IMPORT_TARGET_MISMATCH`. `other` não trava nada — só perde a
        checagem.

        `inter` (Banco Inter) entrou em 18/09/2026 com o extrato de conta
        (`inter.checking.v1`); a fatura do cartão do Inter ainda não tem parser.
      enum: [c6, inter, nubank, other]

    CardStatementStatus:
      type: string
      description: |
        **Derivado** (ADR-023d), nunca coluna: `paga` quando
        `paidCents >= totalCents`; senão `vencida` quando `dueDate` é anterior a
        hoje **no fuso da casa** (ADR-019a); senão `em_aberto`.
      enum: [em_aberto, paga, vencida]

    CardStatementSource:
      type: string
      description: No v1 só existe `import` — a fatura nasce da importação.
      enum: [import, manual]

    CardStatement:
      type: object
      additionalProperties: false
      required:
        [id, accountId, competenceMonth, closingDate, dueDate, totalCents, paidCents,
         status, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          description: Obrigatoriamente uma conta `kind = credit_card` da casa.
        competenceMonth:
          allOf:
            - $ref: "#/components/schemas/YearMonth"
          description: |
            Mês do **VENCIMENTO**, não o do fechamento (spec 0004 §3.4, D2). Uma
            fatura com linhas de 06/08 a 05/09 que vence em 13/09 é a "fatura de
            setembro" para qualquer pessoa, e é assim que o app a chama.
        closingDate: { $ref: "#/components/schemas/CivilDate" }
        dueDate: { $ref: "#/components/schemas/CivilDate" }
        totalCents:
          type: integer
          format: int64
          description: |
            **Derivado**: soma das despesas menos as receitas das linhas com este
            `statementId`, em CENTAVOS. Nunca é coluna no banco.
        paidCents:
          type: integer
          format: int64
          description: |
            **Derivado**: soma dos `transfer_in` com este `statementId`, em
            CENTAVOS. Pagar a fatura é uma **transferência** (ADR-016) da conta
            corrente para a conta do cartão — é ela, e só ela, que traz a dívida
            de volta a zero.
        status: { $ref: "#/components/schemas/CardStatementStatus" }
        source: { $ref: "#/components/schemas/CardStatementSource" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CardStatementList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CardStatement" }

    CardStatementDetail:
      type: object
      additionalProperties: false
      required: [statement, items, nextCursor]
      properties:
        statement: { $ref: "#/components/schemas/CardStatement" }
        items:
          type: array
          description: Lançamentos da fatura, paginados pelo cursor de lançamentos.
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/TransactionCursor"
            - type: "null"

    ImportDocKind:
      type: string
      description: |
        Tipo de documento, detectado pelo cabeçalho. É ele que decide a trava
        mais forte da importação: `card_statement` só entra em conta
        `credit_card`, e `checking_statement` só entra em conta que **não** seja
        cartão.
      enum: [checking_statement, card_statement]

    ImportBatchStatus:
      type: string
      description: |
        `pending` é o único estado em que o lote pode ser confirmado ou
        descartado; `discarded` e `expired` respondem 404 no confirm. `expired`
        é posto pelo janitor quando as 24 h passam.
      enum: [pending, committed, discarded, expired]

    ImportEncoding:
      type: string
      description: |
        Codificação com que o CSV foi lido. Sem UTF-8 válido, a leitura cai para
        **Windows-1252** — e não Latin-1 puro, porque 0x80–0x9F carregam
        travessão, aspas curvas e o símbolo do euro, que bancos brasileiros usam.
      enum: [utf-8, windows-1252]

    ImportFormatID:
      type: string
      description: |
        Id do parser que ganhou a detecção — par (instituição × documento),
        versionado. Allowlist do registro: valor fora dela é 400.
      pattern: "^[a-z0-9]+(\\.[a-z0-9_]+){1,3}$"
      maxLength: 40
      examples: ["nubank.card_statement.v1"]

    ImportRowStatus:
      type: string
      description: |
        Taxonomia da revisão (spec 0004 §4.6). A exigência "nada entra sem
        confirmação" é cumprida pelo par **status + default**; o índice único é a
        rede embaixo do trapézio, não o trapézio.

        | Status | Significado | Default |
        |---|---|---|
        | `novo` | nenhuma colisão | importar |
        | `repetido_no_arquivo` | 2ª ocorrência idêntica dentro do próprio arquivo, e o banco não tem tantas (só chave derivada) | importar |
        | `duplicado_exato` | chave e ordinal já existem numa linha **viva**; ou o mesmo identificador do emissor já apareceu numa linha anterior do próprio arquivo (sem `matchTransactionId`) | barrar, **não liberável** |
        | `duplicado_excluido` | a linha existente está excluída logicamente | barrar; liberar **restaura** a existente |
        | `possivel_duplicado` | marcação fraca (mesma conta, mesmo valor, data ±3 dias, descrição diferente; ou id externo já usado em outra conta da casa) | barrar; liberar entra como ocorrência nova |
        | `pagamento_de_fatura` | classificada como pagamento ou recebimento de fatura | barrar; a opção oferecida é registrar como transferência |
        | `transferencia_interna` | descrição bate (≥ 80) com palavra-chave de OUTRA conta ativa da casa; `suggestedCounterpartAccountId` preenchido | barrar; ações `transfer` (par), `import` (entra como receita/despesa comum) e `skip` |
        | `transferencia_ja_registrada` | a outra perna já existe (mesma conta, contraparte igual à sugerida, mesmo valor, ±3 dias); `matchTransactionId` aponta para ela | **`link`**: não cria movimento — grava a chave desta linha na perna existente; ou `skip`. `import` NÃO é oferecido |
        | `rejeitado` | linha malformada | barrar, **não liberável** |
      enum:
        - novo
        - repetido_no_arquivo
        - duplicado_exato
        - duplicado_excluido
        - possivel_duplicado
        - pagamento_de_fatura
        - transferencia_interna
        - transferencia_ja_registrada
        - rejeitado

    ImportRejectReason:
      type: string
      description: |
        **Código**, nunca o conteúdo da linha — a linha crua não é guardada nem
        devolvida. Allowlist fechada para que a tela traduza o motivo em vez de
        interpretar texto em português. Motivo novo entra aqui **antes** de
        existir no servidor.
      enum: [invalid_date, invalid_amount, invalid_sign, invalid_columns, empty_row]

    ImportDecisionAction:
      type: string
      description: |
        `import` grava a linha · `skip` a ignora · `transfer` cria o **par** de
        transferência (ADR-016) dentro da mesma transação — aceito em
        `pagamento_de_fatura` e em `transferencia_interna` · `link` só é aceito
        em `transferencia_ja_registrada`: **não cria lançamento**, grava na perna
        existente (a apontada por `matchTransactionId`, calculada pela análise —
        o corpo não tem esse campo) o `externalId`, a chave de deduplicação e o
        lote desta linha, para a reimportação cair em `duplicado_exato`.
      enum: [import, skip, transfer, link]

    ImportRowCounts:
      type: object
      additionalProperties: false
      required:
        [novo, repetido_no_arquivo, duplicado_exato, duplicado_excluido,
         possivel_duplicado, pagamento_de_fatura, transferencia_interna,
         transferencia_ja_registrada, rejeitado]
      description: |
        Quantas linhas caíram em cada status da análise. Existe enquanto o lote
        está `pending`; some quando as linhas de *staging* são apagadas.
      properties:
        novo: { type: integer, minimum: 0 }
        repetido_no_arquivo: { type: integer, minimum: 0 }
        duplicado_exato: { type: integer, minimum: 0 }
        duplicado_excluido: { type: integer, minimum: 0 }
        possivel_duplicado: { type: integer, minimum: 0 }
        pagamento_de_fatura: { type: integer, minimum: 0 }
        transferencia_interna: { type: integer, minimum: 0 }
        transferencia_ja_registrada: { type: integer, minimum: 0 }
        rejeitado: { type: integer, minimum: 0 }

    ImportOutcome:
      type: object
      additionalProperties: false
      required: [imported, restored, skipped, blocked, rejected, linked]
      description: |
        O que o confirm fez de fato. Sobrevive ao lote como histórico, mesmo
        depois que as linhas de *staging* são apagadas.
      properties:
        imported: { type: integer, minimum: 0 }
        restored:
          type: integer
          minimum: 0
          description: |
            Linhas cuja gêmea estava excluída logicamente e foram **restauradas**
            em vez de reinseridas (ADR-025f). A restauração altera apenas
            `deletedAt` e `updatedAt` — nenhum campo financeiro é tocado.
        skipped: { type: integer, minimum: 0 }
        blocked:
          type: integer
          minimum: 0
          description: |
            Linhas que o confirm recusou ao recalcular dentro da transação.
            Bloqueio **não** é falha do lote.
        rejected: { type: integer, minimum: 0 }
        linked:
          type: integer
          minimum: 0
          description: |
            Linhas vinculadas a uma perna de transferência que já existia
            (ação `link`). Não criaram lançamento e não entram em `imported`.

    StatementSuggestion:
      type: object
      additionalProperties: false
      required: [competenceMonth, closingDate, dueDate]
      description: |
        **Sugestão**, nunca decisão: vem de `statementClosingDay` e
        `statementDueDay` da conta quando configurados, e cai para uma inferência
        a partir da maior data do arquivo quando não. O usuário confirma no passo
        de revisão.

        O nome do arquivo entra como pista **apenas** aqui, e nunca como regra —
        nome de arquivo é entrada do cliente, e uma fatura arquivada no mês errado
        estragaria a competência de dezenas de linhas.
      properties:
        competenceMonth: { $ref: "#/components/schemas/YearMonth" }
        closingDate: { $ref: "#/components/schemas/CivilDate" }
        dueDate: { $ref: "#/components/schemas/CivilDate" }

    ImportBatch:
      type: object
      additionalProperties: false
      required:
        [id, status, accountId, institution, docKind, formatId, fileName, encoding,
         rowCount, minDate, maxDate, counts, outcome, statementSuggestion,
         sameContentImportedAt, expiresAt, createdAt, committedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ImportBatchStatus" }
        accountId: { type: string, format: uuid }
        institution:
          allOf:
            - $ref: "#/components/schemas/Institution"
          description: |
            Instituição **detectada no arquivo**, não a da conta. Nunca é
            `other`: um lote só existe quando um parser reconheceu o cabeçalho.
        docKind: { $ref: "#/components/schemas/ImportDocKind" }
        formatId: { $ref: "#/components/schemas/ImportFormatID" }
        fileName:
          type: string
          maxLength: 200
          description: |
            **Sanitizado**: sem separador de caminho, sem `..` e sem caractere de
            controle. É conteúdo do usuário e é exibido na tela, então passa
            pelas mesmas regras da descrição.
        encoding: { $ref: "#/components/schemas/ImportEncoding" }
        rowCount:
          type: integer
          minimum: 0
          description: Linhas de dados do arquivo. Teto de 10.000.
        minDate: { $ref: "#/components/schemas/CivilDate" }
        maxDate: { $ref: "#/components/schemas/CivilDate" }
        counts:
          oneOf:
            - $ref: "#/components/schemas/ImportRowCounts"
            - type: "null"
          description: |
            Análise por status. Presente enquanto o lote está `pending`; **nulo**
            depois que as linhas de *staging* são apagadas (confirm ou descarte).
        outcome:
          oneOf:
            - $ref: "#/components/schemas/ImportOutcome"
            - type: "null"
          description: Preenchido quando o lote foi confirmado; nulo antes disso.
        statementSuggestion:
          oneOf:
            - $ref: "#/components/schemas/StatementSuggestion"
            - type: "null"
          description: |
            Só existe quando `docKind = card_statement`. Nulo em extrato.
        sameContentImportedAt:
          type: [string, "null"]
          format: date-time
          description: |
            **Aviso, nunca bloqueio** (ADR-025d): quando preenchido, este mesmo
            conteúdo já foi importado nesta data. O hash é do conteúdo
            normalizado (pós-extração, sem BOM, com quebra de linha em LF), nunca
            dos bytes do arquivo enviado — duas compactações do mesmo CSV diferem
            em timestamp, nível de compressão e vetor da cifra.

            Bloquear seria frouxo (um byte a mais deixa passar um arquivo 99%
            repetido) e rigoroso ao mesmo tempo (travaria quem reimporta de
            propósito para pegar três linhas novas). **Economiza tempo; não é
            defesa.**
        expiresAt:
          type: string
          format: date-time
          description: |
            `createdAt` mais 24 h. Passou disso, o janitor marca `expired` e apaga
            as linhas — dado financeiro parado numa tabela de *staging* tem prazo.
        createdAt: { type: string, format: date-time }
        committedAt:
          type: [string, "null"]
          format: date-time

    ImportBatchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportBatch" }

    ImportRow:
      type: object
      additionalProperties: false
      required:
        [id, seq, lineNo, status, defaultAction, allowedActions, kind, occurredOn,
         amountCents, description, externalId, rejectReason, matchTransactionId,
         suggestedCategoryId, matchScore, matchedKeyword, suggestedCounterpartAccountId,
         matchOccurredOn]
      description: |
        Uma linha do *staging*. É **exatamente o que será gravado** se a decisão
        for `import` — não é a linha crua do arquivo, que não é guardada.
      properties:
        id: { type: string, format: uuid }
        seq:
          type: integer
          minimum: 1
          description: |
            Ordem no arquivo (1-based). É também a chave do cursor de paginação
            da revisão.
        lineNo:
          type: integer
          minimum: 1
          description: |
            Linha física no CSV. Existe para a mensagem de erro de uma linha
            `rejeitado` poder dizer ONDE, já que o conteúdo dela não é devolvido.
        status: { $ref: "#/components/schemas/ImportRowStatus" }
        defaultAction:
          allOf:
            - $ref: "#/components/schemas/ImportDecisionAction"
          description: |
            O que acontece com esta linha se ela **não** for citada no confirm. É
            o servidor quem manda nesse valor: a tela não reimplementa a tabela
            de defaults da §4.6, e o corpo do confirm carrega só as exceções.
        allowedActions:
          type: array
          description: |
            Ações oferecidas para esta linha. Vazia em `duplicado_exato` e em
            `rejeitado` — não liberáveis. `transfer` só aparece em
            `pagamento_de_fatura` e em `transferencia_interna`; `link` só em
            `transferencia_ja_registrada`. Decisão com ação fora desta lista é
            400.
          items: { $ref: "#/components/schemas/ImportDecisionAction" }
        kind:
          oneOf:
            - $ref: "#/components/schemas/TransactionKind"
            - type: "null"
          description: |
            Nulo **apenas** em linha `rejeitado`, que por definição não produziu
            valores de domínio. Em toda outra linha vem preenchido.
        occurredOn:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
          description: Nulo apenas em linha `rejeitado`.
        amountCents:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 99999999999
          description: |
            Em **CENTAVOS**, não-negativo; o sinal vem do `kind`. O número é
            partido em parte inteira e duas casas decimais e montado em `int64` —
            `ParseFloat` é proibido neste caminho (ADR-003). Nulo apenas em linha
            `rejeitado`.
        description:
          type: [string, "null"]
          maxLength: 140
          description: |
            Já sanitizada e truncada — é o texto que será gravado. Nulo apenas em
            linha `rejeitado`.
        externalId:
          type: [string, "null"]
          maxLength: 64
          description: |
            Chave natural do banco (o identificador por transação), quando o
            documento tiver uma. Exibida para conferência; **não** é a chave de
            deduplicação, que nunca sai do servidor.
        rejectReason:
          oneOf:
            - $ref: "#/components/schemas/ImportRejectReason"
            - type: "null"
          description: Preenchido somente quando `status = rejeitado`.
        matchTransactionId:
          type: [string, "null"]
          format: uuid
          description: |
            O lançamento existente que motivou a marcação, quando houver — é o
            que permite à tela oferecer um link para ele em vez de só dizer
            "duplicada".
        suggestedCategoryId:
          type: [string, "null"]
          format: uuid
          description: |
            Categoria sugerida pelas palavras-chave (spec 0005 §3), calculada
            no servidor contra as categorias ATIVAS da mesma natureza do `kind`.
            É o **default** da linha no confirm: decisão ausente grava esta;
            `categoryId: null` explícito grava sem categoria. Nula quando não há
            correspondência ≥ 80, quando há empate, e sempre em linha
            `transferencia_*`.
        matchScore:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: |
            Pontuação da correspondência que decidiu. Descreve a **categoria**
            quando `suggestedCategoryId` está presente; descreve a **conta
            contraparte** em linha `transferencia_*` (que nunca tem categoria).
            A tela mostra como texto ("88% · supermercado"); 100 não mostra
            pontuação.
        matchedKeyword:
          type: [string, "null"]
          maxLength: 40
          description: A palavra-chave (forma exibível) que decidiu. Mesma regra de `matchScore`.
        suggestedCounterpartAccountId:
          type: [string, "null"]
          format: uuid
          description: |
            Conta da OUTRA perna sugerida pelas palavras-chave de conta — nunca a
            conta do lote, nunca conta arquivada. Preenchida em
            `transferencia_interna`, em `transferencia_ja_registrada` e também
            em `pagamento_de_fatura` quando alguma conta bateu (o status não
            muda). É o default de `counterpartAccountId` na decisão `transfer`.
        matchOccurredOn:
          oneOf:
            - $ref: "#/components/schemas/CivilDate"
            - type: "null"
          description: |
            Data do lançamento apontado por `matchTransactionId`, quando houver —
            é o que permite à tela dizer "já registrada em 05/09" em vez de só
            "já registrada". Uma consulta por página, nunca uma por linha.

    ImportPreview:
      type: object
      additionalProperties: false
      required: [batch, items, nextCursor]
      properties:
        batch: { $ref: "#/components/schemas/ImportBatch" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }
        nextCursor:
          type: [integer, "null"]
          minimum: 1
          description: |
            O `seq` a partir do qual continuar. Nulo quando não há mais página.

    ImportRowCursor:
      type: integer
      minimum: 1
      description: |
        O `seq` da última linha já recebida. Valor fora da faixa é 400. Não
        carrega autorização: o lote é escopado pela casa do token.

    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [file, accountId]
      description: |
        Corpo de `POST /imports`, em `multipart/form-data`. **No máximo quatro
        partes**, e parte com nome fora desta lista é 400 — não se ignora em
        silêncio (spec 0004 §6.7).
      properties:
        file:
          type: string
          format: binary
          description: |
            CSV solto ou ZIP com uma **única** entrada `.csv`. Máximo de 8 MiB.
            O tipo real é decidido pelos **magic bytes**, nunca pela extensão nem
            pelo `Content-Type` da parte. Nada é escrito em disco em momento
            algum — a extração é 100% em memória.
        accountId:
          type: string
          format: uuid
          description: |
            Conta de destino, DA CASA DO TOKEN. Conta de outra casa responde
            **404**; conta arquivada responde 422 `VALIDATION_FAILED` com
            `fields.accountId`.
        password:
          type: string
          maxLength: 128
          writeOnly: true
          description: |
            Senha do ZIP. Só faz sentido em arquivo cifrado. **Nunca** é gravada,
            logada, auditada, ecoada nem devolvida em resposta nenhuma — vive
            como bytes, é usada e zerada. No cliente: campo `type="password"`,
            `autocomplete="off"`, fora de `sessionStorage` e de `localStorage`,
            apagada do estado assim que a requisição sai, e **jamais** em query
            string.
        format:
          allOf:
            - $ref: "#/components/schemas/ImportFormatID"
          description: |
            Desempate manual, necessário **apenas** depois de um
            `IMPORT_FORMAT_AMBIGUOUS`: o cliente reenvia o arquivo com um dos
            candidatos que vieram em `fields.format`. Fora da allowlist do
            registro é 400.

    ImportDecision:
      type: object
      additionalProperties: false
      required: [rowId, action]
      description: |
        Uma exceção ao default. Só existem estes cinco campos: valor, data,
        descrição, `kind` e — em `link` — a perna existente vêm do *staging*, e
        mandá-los aqui é 400. `link` não aceita `categoryId`,
        `counterpartAccountId` nem `statementId`.
      properties:
        rowId:
          type: string
          format: uuid
          description: |
            Linha **daquele lote**. `rowId` de outro lote é 400, nunca ignorado
            em silêncio.
        action: { $ref: "#/components/schemas/ImportDecisionAction" }
        categoryId:
          type: [string, "null"]
          format: uuid
          description: |
            **Tri-estado**, só com `action: "import"`: **ausente** = usa
            `suggestedCategoryId` (ou `defaultCategoryId`, nesta ordem); **nulo
            explícito** = grava SEM categoria apesar da sugestão; **valor** = usa
            este. Presente (mesmo nulo) com outra ação é 400. Categoria de outra
            casa é 404 e nada é gravado (tudo ou nada). Categoria arquivada, de
            natureza trocada ou **grupo com subcategoria ativa** (emenda §13) é
            422 em `fields.categoryId`, e o lote inteiro volta atrás.
        counterpartAccountId:
          type: string
          format: uuid
          description: |
            Conta da **outra perna** do par (ADR-016), só com `action:
            "transfer"`. Obrigatório em `pagamento_de_fatura`; em
            `transferencia_interna` pode faltar — o servidor usa
            `suggestedCounterpartAccountId`. Presente, é validado como da casa
            dentro da transação (404) e precisa ser diferente da conta do lote
            (400). Contraparte **arquivada** — explícita ou sugerida — é 422
            `VALIDATION_FAILED` em `fields.counterpartAccountId` (spec 0005
            §12), e nada é gravado.
        statementId:
          type: string
          format: uuid
          description: |
            Fatura que este pagamento quita, com `action: "transfer"`. Fatura de
            outra casa é 404.

    StatementConfirmation:
      type: object
      additionalProperties: false
      required: [competenceMonth, closingDate, dueDate]
      description: |
        Competência, fechamento e vencimento confirmados **pelo usuário** a
        partir de `statementSuggestion`. A competência é o mês do VENCIMENTO
        (D2).
      properties:
        competenceMonth: { $ref: "#/components/schemas/YearMonth" }
        closingDate: { $ref: "#/components/schemas/CivilDate" }
        dueDate: { $ref: "#/components/schemas/CivilDate" }

    ConfirmImportRequest:
      type: object
      additionalProperties: false
      required: [decisions]
      description: |
        `statement` é **obrigatório** quando o lote é `card_statement` e
        **proibido** em extrato — os dois desvios são 400. A condição depende do
        lote, e não do corpo, então ela não cabe em `required`: está cobrada no
        servidor e testada.
      properties:
        decisions:
          type: array
          maxItems: 2000
          description: |
            **Apenas as exceções** ao default de cada linha. Lista vazia é
            legítima e quer dizer "aceito todos os defaults". O teto de 2.000
            existe para o corpo caber no limite de 1 MiB — com 10.000 `rowId` ele
            estouraria.

            Linha marcada **só entra com `action: "import"` explícito**.
          items: { $ref: "#/components/schemas/ImportDecision" }
        statement:
          oneOf:
            - $ref: "#/components/schemas/StatementConfirmation"
            - type: "null"
        defaultCategoryId:
          type: [string, "null"]
          format: uuid
          description: |
            Categoria aplicada a toda linha importada que **não** tenha
            `categoryId` na decisão **nem** `suggestedCategoryId` da análise. A
            sugestão da linha vence este default; `categoryId: null` na decisão
            vence os dois. Nulo deixa as demais linhas sem categoria (D3). Vale
            para ele a mesma recusa de `ImportDecision.categoryId`: arquivada,
            de natureza trocada ou grupo com subcategoria ativa é 422 em
            `fields.categoryId`.

    ImportBlockedRow:
      type: object
      additionalProperties: false
      required: [rowId, reason]
      properties:
        rowId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ImportRowStatus" }

    ImportResult:
      type: object
      additionalProperties: false
      required:
        [id, status, imported, restored, skipped, blocked, rejected, linked, statementId,
         transfersCreated, blockedRows]
      description: |
        Resultado do confirm. Um segundo confirm do mesmo lote devolve **esta
        mesma resposta**, sem importar nada de novo.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ImportBatchStatus" }
        imported: { type: integer, minimum: 0 }
        restored: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        linked:
          type: integer
          minimum: 0
          description: Linhas vinculadas a perna existente (`link`). Não entram em `imported` nem em `transfersCreated`.
        statementId:
          type: [string, "null"]
          format: uuid
          description: |
            A fatura criada ou **reutilizada** — importar a mesma fatura duas
            vezes reaproveita a existente, por força do índice único
            `(household, conta, competência)`. Nulo em extrato.
        transfersCreated:
          type: integer
          minimum: 0
          description: Pares de transferência criados (cada par conta como 1).
        blockedRows:
          type: array
          maxItems: 2000
          description: |
            Linhas que o recálculo dentro da transação recusou. Trazem o motivo
            como **código**, nunca texto.
          items: { $ref: "#/components/schemas/ImportBlockedRow" }

    ImportErrorCode:
      type: string
      description: |
        Subconjunto de `ErrorCode` que `POST /imports` e
        `POST /imports/{id}/confirm` podem devolver em **422**.

        Cada código existe porque mapeia para **uma ação diferente da interface**
        — é essa correspondência, e nada mais, que justifica seis códigos em vez
        de um. Colapsá-los em `VALIDATION_FAILED` obrigaria o frontend a
        interpretar texto em português, que é exatamente o que a D4 da spec 0003
        recusou. **Quem for "simplificar" isto depois: a tabela abaixo é o
        motivo.**

        | Código | Quando | O que a tela FAZ |
        |---|---|---|
        | `IMPORT_PASSWORD_REQUIRED` | ZIP com o bit de cifra ligado e sem senha | **abre o campo de senha** e explica que a do C6 é o CPF só com números — não diz "dados inválidos" |
        | `IMPORT_PASSWORD_INVALID` | o CRC não bateu depois de decifrar | **mantém o campo de senha e pede de novo**, sem perder o arquivo já escolhido |
        | `IMPORT_FORMAT_UNKNOWN` | nenhum parser reconheceu o cabeçalho | **lista os formatos suportados** — é a resposta para arquivo do C6 enquanto os parsers dele não existem |
        | `IMPORT_FORMAT_AMBIGUOUS` | mais de um parser casou | **mostra um seletor** com os candidatos, que vêm em `fields.format`, e reenvia com `format` explícito |
        | `IMPORT_TARGET_MISMATCH` | instituição diferente da da conta, ou fatura em conta que não é cartão | manda **trocar a conta de destino**, não o arquivo |
        | `IMPORT_FILE_REJECTED` | limites: tamanho, nº de linhas, razão de compressão, entradas no ZIP, janela de datas larga demais, arquivo vazio, mais de 20% de linhas rejeitadas | **explica qual limite estourou** (`fields` diz qual) e sugere importar por período menor. Um código só para todos os limites evita inflar a enum |

        `VALIDATION_FAILED` continua existindo para o resto — conta arquivada
        como destino, por exemplo, responde 422 `VALIDATION_FAILED` com
        `fields.accountId`, seguindo o padrão já existente.
      enum:
        - IMPORT_PASSWORD_REQUIRED
        - IMPORT_PASSWORD_INVALID
        - IMPORT_FORMAT_UNKNOWN
        - IMPORT_FORMAT_AMBIGUOUS
        - IMPORT_TARGET_MISMATCH
        - IMPORT_FILE_REJECTED
        - VALIDATION_FAILED

    ImportError:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        Envelope de erro da importação. Mesma forma do `Error` de sempre, com o
        `code` restrito ao conjunto que a tela de importação sabe tratar e com
        `fields` opcional.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ImportErrorCode" }
            message:
              type: string
              description: |
                Mensagem genérica em pt-BR. Nunca contém detalhe interno, trecho
                do arquivo, linha crua nem — jamais — a senha do ZIP.
            fields:
              type: object
              additionalProperties: { type: string }
              description: |
                Contexto legível por máquina. Em `IMPORT_FORMAT_AMBIGUOUS`,
                `fields.format` traz os candidatos; em `IMPORT_FILE_REJECTED`,
                diz qual limite estourou. Nunca carrega conteúdo do arquivo.
    # -------------------------------------------------------------------------
    # Menu IA (spec 0010, entrega E9)
    # -------------------------------------------------------------------------

    AiExportStats:
      type: object
      additionalProperties: false
      required: [accounts, categories, descriptions, transactions, truncatedDescriptions]
      description: |
        As contagens que a tela mostra ao lado do prompt ("32 descrições
        distintas · 4 contas · 41 categorias"). Elas existem para a pessoa ver o
        TAMANHO do que está prestes a colar em outro lugar antes de colar.
      properties:
        accounts:
          type: integer
          minimum: 0
          description: Contas **ativas** listadas no prompt; arquivada não entra.
        categories:
          type: integer
          minimum: 0
          description: Categorias **ativas** listadas no prompt, grupos inclusive.
        descriptions:
          type: integer
          minimum: 0
          description: |
            Descrições distintas (`COUNT(DISTINCT description_norm)`) que
            **sobraram** no prompt, já descontado qualquer corte.
        transactions:
          type: integer
          minimum: 0
          description: Lançamentos vivos da janela agrupados nessas descrições.
        truncatedDescriptions:
          type: integer
          minimum: 0
          description: |
            Descrições deixadas de fora por teto de linhas, cortadas por
            ocorrências decrescentes. Zero quando o corpus coube inteiro.

            O prompt **declara** este número no próprio texto (§3.1): corte
            silencioso faria a IA responder com confiança sobre um extrato que
            não é o da pessoa.

    AiExportPrompt:
      type: object
      additionalProperties: false
      required: [prompt, fromMonth, toMonth, generatedAt, stats]
      description: |
        O texto pronto, em Markdown, e nada além dele — esta rota não devolve
        lançamento, valor solto nem estrutura para a tela remontar o prompt. A
        tela exibe, copia e baixa o MESMO texto, byte a byte.
      properties:
        prompt:
          type: string
          description: |
            Markdown, nas **9 seções e na ordem** da §3.1 da spec 0010: papel e
            contexto; como o motor casa (limiar 80, aproximação por substring de
            5 runas, erro de digitação a distância 1, empate anula); a diferença
            entre palavra-chave de categoria e de conta, com o alerta explícito
            contra palavra genérica de conta; as regras que o JSON precisa
            respeitar; quando criar categoria nova; contas; categorias;
            movimentações agrupadas por descrição; e a tarefa com um exemplo
            completo de resposta válida.

            **Sem `maxLength` de propósito:** o teto de linhas do corpus é
            medido em dados reais antes de ser cravado (§3.1), e um número
            inventado aqui viraria contrato antes da medição.
        fromMonth: { $ref: "#/components/schemas/YearMonth" }
        toMonth: { $ref: "#/components/schemas/YearMonth" }
        generatedAt:
          type: string
          format: date-time
          description: |
            Instante ISO 8601 UTC da geração. O prompt é um retrato, e ele diz
            de quando — colar amanhã um prompt de hoje continua funcionando,
            mas a pessoa sabe o que tem na mão.
        stats: { $ref: "#/components/schemas/AiExportStats" }

    CategoryPathRef:
      type: string
      maxLength: 123
      pattern: "^[^>]{1,60} > [^>]{1,60}$"
      description: |
        Caminho **normalizado** de uma categoria de dois níveis —
        `grupo > folha`, sem acento, sem caixa e com espaços colapsados
        (`internal/textnorm`). O separador é espaço, `>`, espaço.

        É o `ref` estável entre a prévia e a confirmação (§4.1 da spec 0010): a
        categoria nova **não tem id** porque ainda não existe, então a chave é o
        nome, e o caminho normalizado é o que sobrevive à ida e volta **sem
        estado no servidor**. O cliente só devolve, em `skipNewCategories`, o
        que o servidor mandou.

        Nome que contenha `>` não produz caminho decomponível e é recusado como
        `invalid_name`: a ambiguidade custaria a estabilidade do `ref`.
      examples: ["alimentacao > padaria"]

    NewCategoryEntry:
      type: object
      additionalProperties: false
      required: [group, name]
      description: |
        Uma **subcategoria** a criar, e o grupo em que ela se encaixa. A chave é
        o par `group` + `name`, comparado normalizado — a categoria nova não tem
        id porque ainda não existe.

        Toda categoria criada por aqui é **folha**. O grupo nasce só como
        continente e **nunca recebe palavra-chave**: grupo com subcategoria
        ativa não recebe lançamento, logo não recebe palavra (spec 0005 §12), e
        dar palavras a um grupo que acabou de ganhar uma folha seria criar o
        problema no ato da criação. Quem quer grupo com palavras próprias o cria
        na tela de categorias, conscientemente.

        `kind` só é usado quando o **grupo é novo**, e aí é obrigatório. Com
        grupo existente a natureza é **herdada**, e um `kind` divergente é
        **recusa** (`kind_mismatch`), nunca silêncio.
      properties:
        group: { type: string, minLength: 1, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        add:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: As palavras que nascem com a folha. Lista vazia é válida.

    CategoryKeywordEntry:
      type: object
      additionalProperties: false
      required: [categoryId, categoryPath, add]
      description: |
        Palavras a **acrescentar** a uma categoria que já existe. Só adiciona:
        não existe campo de remoção nesta spec, e tirar palavra continua no
        diálogo de categorias.
      properties:
        categoryId: { type: string, format: uuid }
        categoryPath:
          type: string
          maxLength: 123
          description: |
            O caminho exibível `Grupo > Folha` **como o export mandou**, e é
            **conferência obrigatória**, não decoração: se o nome não bater
            (comparado normalizado) com a categoria daquele `categoryId`, a
            entrada inteira é recusada com `name_mismatch`. É o que pega id
            alucinado, id trocado entre linhas e JSON gerado do export de outra
            casa.
        add:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }

    AccountKeywordEntry:
      type: object
      additionalProperties: false
      required: [accountId, accountName, add]
      description: |
        Palavras a **acrescentar** a uma conta que já existe. Este import
        **não cria, não renomeia, não arquiva e não exclui conta**: conta tem
        saldo de abertura, instituição e dia de fechamento — é objeto do mundo
        real e nasce pela mão da pessoa.

        Palavra-chave de conta é o gatilho de **transferência interna**, e é a
        mais perigosa do formato: uma palavra genérica (`pagamento`, `pix`)
        converte dezenas de lançamentos legítimos em transferência. Daí a
        medição de `impact` na prévia.
      properties:
        accountId: { type: string, format: uuid }
        accountName:
          type: string
          maxLength: 80
          description: |
            O nome da conta **como o export mandou** — mesma conferência
            obrigatória do `categoryPath`: nome que não bate com o
            `accountId` é `name_mismatch` para a entrada inteira.
        add:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }

    KeywordImportPayload:
      type: object
      additionalProperties: false
      required: [homefinanceKeywordImport]
      description: |
        O JSON **como a IA devolveu**, colado pela pessoa. É entrada hostil por
        definição: `additionalProperties: false` aqui e em todo nível abaixo,
        conjunto fechado de campos, e nenhum campo capaz de renomear, mover,
        arquivar ou excluir coisa nenhuma.

        As três listas são opcionais, mas **todas ausentes ou vazias é 400
        `VALIDATION_FAILED`** em `fields.payload` — relatório vazio não é
        resposta útil para um clique em "Conferir".
      properties:
        homefinanceKeywordImport:
          type: integer
          const: 1
          description: |
            Versão do formato. Ausente ou diferente de `1` é 400. Ela existe
            para o dia em que o formato mudar: um payload de outra versão tem de
            falhar alto, não ser interpretado pela metade.
        newCategories:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NewCategoryEntry" }
        categoryKeywords:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CategoryKeywordEntry" }
        accountKeywords:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/AccountKeywordEntry" }
        notes:
          type: string
          maxLength: 10000
          description: |
            Texto livre, aceito e **descartado**: nunca gravado, nunca exibido,
            nunca devolvido. Existe por uma razão só — a IA sempre quer explicar
            o que fez, e sem este campo a explicação viraria 400 por campo
            desconhecido num payload que no mais estava certo.

            Descartá-lo (em vez de guardá-lo) fecha a superfície de texto livre
            de IA renderizado dentro do app.

    KeywordImportEnvelope:
      type: object
      additionalProperties: false
      required: [payload, fromMonth, toMonth]
      description: |
        O corpo que o frontend manda nas **duas** rotas. Os corpos são idênticos
        de propósito: é o que torna literal a promessa de que o confirm
        **revalida tudo do zero** e de que a prévia não é credencial.
      properties:
        payload: { $ref: "#/components/schemas/KeywordImportPayload" }
        fromMonth: { $ref: "#/components/schemas/YearMonth" }
        toMonth: { $ref: "#/components/schemas/YearMonth" }
        skipNewCategories:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CategoryPathRef" }
          description: |
            Os caminhos **normalizados** das categorias novas que a pessoa
            desmarcou na prévia. Ausente no preview, preenchido no confirm.

            Desmarcar não é só não criar: **as palavras daquela categoria somem
            junto** (`skipped_by_user`) — elas não têm para onde ir. Caminho que
            não corresponde a nenhuma entrada de `newCategories` é ignorado sem
            erro: é o cliente devolvendo o que recebeu, e uma recusa aí só
            criaria um 400 que ninguém sabe consertar.

            **Desmarcar não muda o desfecho de nenhuma outra entrada.** A
            categoria desmarcada continua ocupando o lugar dela na conferência
            (o teto de 200, o `kind` que ela deu ao grupo novo, a palavra que
            disputava com outro item) e só deixa de ser gravada: o confirm nunca
            grava algo que a prévia mostrou como recusado, e o que a prévia
            mostrou como `created`/`added` num item marcado continua igual.

    KeywordImportSkipReason:
      type: string
      description: |
        `already_present` — a palavra **já existe no próprio item**. Pular (em
        vez de recusar) é o que torna reimportar o mesmo JSON inofensivo, e é a
        diferença entre "não fiz nada porque já estava feito" e "não fiz porque
        está errado".
      enum: [already_present]

    KeywordImportRejectReason:
      type: string
      description: |
        Conjunto **fechado** das recusas da §4.2 da spec 0010. O texto em
        português é do frontend, não da API — a tela escolhe a frase pelo
        código, como em todo o resto do contrato (D4 da spec 0003).

        | Valor | O que aconteceu |
        |---|---|
        | `item_not_found` | O `id` não existe **na casa do token**. Id de outra casa cai aqui, indistinguível de id inexistente (BOLA) |
        | `item_archived` | O item existe, mas está arquivado — e arquivado não participa da correspondência |
        | `name_mismatch` | `categoryPath`/`accountName` não bate com o item daquele `id` (comparado normalizado) |
        | `group_has_children` | O `categoryId` é um **grupo com subcategoria ativa**: grupo com filha não recebe lançamento, logo não recebe palavra (spec 0005 §12) |
        | `invalid_keyword` | Fora de 2–40 runas normalizada, fora do charset, ou sem palavra útil depois da tokenização |
        | `keyword_taken` | A palavra já pertence a **outro item do mesmo tipo** nesta casa; `ownerId` diz de quem é |
        | `ambiguous_in_payload` | A mesma palavra aparece em **dois itens diferentes do próprio JSON** — as **duas** são recusadas, porque ambíguo é pior que vazio |
        | `limit_exceeded` | O item passaria de 20 palavras (existentes + novas); as excedentes são recusadas na ordem do JSON |

        `item_not_found`, `item_archived`, `name_mismatch` e `group_has_children`
        são recusas da **entrada inteira**: todas as palavras dela voltam aqui
        com o mesmo motivo. As outras quatro são por palavra.

        Em `lower_snake`, como `below_threshold` e `no_mirror` — o que também
        evita a colisão com o `ErrorCode` `KEYWORD_TAKEN`, que é um **status
        409** e não um motivo de linha de relatório.
      enum:
        - item_not_found
        - item_archived
        - name_mismatch
        - group_has_children
        - invalid_keyword
        - keyword_taken
        - ambiguous_in_payload
        - limit_exceeded

    NewCategoryOutcome:
      type: string
      description: |
        Conjunto **fechado** do que aconteceu com uma entrada de
        `newCategories` (§4.3 da spec 0010).

        | Valor | O que aconteceu |
        |---|---|
        | `created` | A folha nasce (com o grupo, quando ele também é novo) |
        | `merged_into_existing` | `grupo > folha` já existe **ativo**: não é criação, e as palavras vão para a categoria existente, passando por todas as validações da §4.2 |
        | `skipped_by_user` | O caminho veio em `skipNewCategories`: a categoria não nasce e **as palavras dela somem junto** |
        | `invalid_name` | `group` ou `name` fora de 1–60 caracteres, vazio depois de normalizado, ou contendo `>` |
        | `kind_required` | O grupo é novo e o `kind` não veio |
        | `invalid_kind` | O grupo é novo e o `kind` está fora do conjunto fechado |
        | `kind_mismatch` | O grupo existe e o `kind` do JSON diverge do dele — a natureza é herdada, e divergir é recusa, não silêncio |
        | `name_taken_archived` | Existe categoria **arquivada** com o mesmo nome no mesmo pai (ou o próprio grupo está arquivado). Nunca se cria uma segunda com o mesmo nome: a saída é desarquivar |
        | `household_limit` | A criação faria a casa passar do teto de **200 categorias**; as excedentes são recusadas na ordem do JSON |
        | `duplicate_in_payload` | Outro bloco do mesmo JSON já pediu este `group > name`; o primeiro vale |

        **`parent_not_group` não existe aqui**, e a ausência é deliberada
        (achado A7 da emenda §10): a categoria nova é chaveada por **nome**, não
        por id, então um `group` com nome de subcategoria simplesmente não acha
        grupo e cai em "grupo não existe". Enum fechado com valor inalcançável é
        armadilha para a tela e para o teste.
      enum:
        - created
        - merged_into_existing
        - skipped_by_user
        - invalid_name
        - kind_required
        - invalid_kind
        - kind_mismatch
        - name_taken_archived
        - household_limit
        - duplicate_in_payload

    KeywordImportItemType:
      type: string
      description: |
        Qual conjunto de palavras-chave a linha do relatório trata. Os dois
        conjuntos são **independentes**: a mesma palavra pode estar numa
        categoria e numa conta ao mesmo tempo, e nunca em duas categorias nem em
        duas contas.
      enum: [category, account]

    KeywordImportSkippedKeyword:
      type: object
      additionalProperties: false
      required: [keyword, reason]
      properties:
        keyword: { $ref: "#/components/schemas/Keyword" }
        reason: { $ref: "#/components/schemas/KeywordImportSkipReason" }

    KeywordImportRejectedKeyword:
      type: object
      additionalProperties: false
      required: [keyword, reason]
      description: |
        Uma palavra que **não** entrou, com o motivo. Não existe campo de texto
        livre aqui: o servidor não devolve `detail`, pelo mesmo motivo de
        `KeywordConflict` — o que a tela precisa para montar "já está em *X*" é
        o `ownerId`, não uma frase do backend que o frontend teria de
        reproduzir.
      properties:
        keyword:
          type: string
          maxLength: 40
          description: |
            A palavra **como o cliente mandou**, truncada em 40 runas. Nos sete
            motivos que passam pela validação de forma ela satisfaz o schema
            `Keyword`; em `invalid_keyword` ela é a forma **bruta** — só assim a
            tela consegue apontar a linha recusada —, neutralizada com a mesma
            allowlist de caracteres visíveis do prompt (o que não desenha vira
            espaço) e, por isso, não é um `Keyword`. Nunca entra em log.
        reason: { $ref: "#/components/schemas/KeywordImportRejectReason" }
        ownerId:
          type: string
          format: uuid
          description: |
            Só em `keyword_taken`: a categoria (ou conta) **desta casa** que já
            tem a palavra. Sempre um recurso da casa do token — nunca um id de
            fora, que é o que tornaria o relatório um oráculo.

    KeywordImportImpact:
      type: object
      additionalProperties: false
      required: [transferCandidates, byKeyword]
      description: |
        O estrago **medido** antes de acontecer, e **só na prévia, só em item de
        conta** (§4.4). Não aparece no confirm: lá a medição não teria a quem
        informar e custaria uma varredura dentro da transação. Nada é escrito
        para medir; o matcher roda sob **um** orçamento de trabalho por
        requisição.
      properties:
        transferCandidates:
          type: integer
          minimum: 0
          description: |
            Total do item: quantos lançamentos vivos `income`/`expense` da
            janela **alguma** das palavras que entrariam alcança (união, sem
            contar duas vezes o lançamento alcançado por duas palavras),
            rodando o `internal/textmatch` sobre as descrições do período com o
            limiar de sempre (80). Zero quando nada entraria.

            O denominador é `totals.periodTransactions`: a tela diz "87 de 212",
            e o limiar de atenção é **proporcional** (`>= 10` **e** `>= 10%`).
            Em absoluto, `nubank` com 24 acertos legítimos gritaria igual a
            `pagamento` com 87. A tela **destaca, sem bloquear** — quem decide é
            a pessoa, mas decide com o número na frente.
        byKeyword:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [keyword, transferCandidates]
            properties:
              keyword: { $ref: "#/components/schemas/Keyword" }
              transferCandidates: { type: integer, minimum: 0 }
          description: |
            A medição POR PALAVRA, uma entrada para cada palavra em `added` do
            mesmo item, na mesma ordem. É esta lista que a tela mostra: a palavra
            genérica ("pagamento", 87) precisa aparecer sozinha, ao lado da
            legítima ("nu pagamentos", 4). Sem ela o número do item não diz qual
            palavra é o problema.

            Só as palavras de `added` — palavra pulada ou recusada não entra, e
            o que não entra não tem impacto a medir. A soma das entradas pode
            ser **maior** que o `transferCandidates` do item: a mesma descrição
            pode casar com duas palavras. Sempre presente, `[]` quando nada
            entraria.

    KeywordImportNewCategory:
      type: object
      additionalProperties: false
      required: [ref, group, name, kind, groupIsNew, outcome, categoryId, add, skipped, rejected]
      description: |
        Uma entrada de `newCategories`, com o que aconteceu (ou aconteceria) com
        ela. É o bloco que a tela mostra **separado e marcado por padrão**, com
        uma caixa por linha para desmarcar.

        As palavras de categoria **nova** viajam aqui, e não em `items`: na
        prévia a categoria ainda não tem id, então não haveria item onde
        pendurá-las — e desmarcar a categoria precisa levar as palavras dela
        junto, numa operação só.
      properties:
        ref: { $ref: "#/components/schemas/CategoryPathRef" }
        group:
          type: string
          maxLength: 60
          description: O nome do grupo na forma **exibível** resolvida pelo servidor.
        name:
          type: string
          maxLength: 60
          description: O nome da folha na forma **exibível** resolvida pelo servidor.
        kind:
          oneOf:
            - $ref: "#/components/schemas/CategoryKind"
            - type: "null"
          description: |
            A natureza **efetiva** da folha: a herdada do grupo quando ele já
            existe, a do JSON quando o grupo é novo. Nula quando a entrada foi
            recusada antes de haver natureza a resolver (`kind_required`,
            `invalid_kind`, `invalid_name`).
        groupIsNew:
          type: boolean
          description: |
            `true` quando o grupo também nasce nesta operação — é o que a tela
            usa para escrever `Saúde (grupo novo) > Farmácia`. O grupo nasce sem
            palavra-chave nenhuma, sempre.
        outcome: { $ref: "#/components/schemas/NewCategoryOutcome" }
        categoryId:
          type: [string, "null"]
          format: uuid
          description: |
            A categoria **desta casa** que recebe as palavras: a existente em
            `merged_into_existing` (nas duas rotas) e a recém-nascida em
            `created` — só no confirm, porque na prévia ela ainda não existe.
            Nula em todos os outros casos. Sempre um recurso da casa do token.
        add:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: |
            As palavras que nascem (prévia) ou nasceram (confirm) com a folha.
            Vazia quando a entrada foi recusada ou desmarcada — o relatório diz
            o que **de fato** entrou, nunca o que foi pedido.
        skipped:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/KeywordImportSkippedKeyword" }
          description: |
            Preenchida no caso `merged_into_existing`, em que as palavras vão
            para uma categoria que já existe e podem já estar lá.
        rejected:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/KeywordImportRejectedKeyword" }
          description: |
            As palavras da folha que não entraram, com o motivo da §4.2 — uma
            palavra já tomada por outra categoria não derruba a criação, e o
            relatório não pode dizer que ela entrou.

    KeywordImportItem:
      type: object
      additionalProperties: false
      required: [type, id, name, added, skipped, rejected]
      description: |
        O que aconteceu com as palavras-chave de **um item que já existia**
        quando o payload chegou — uma categoria ou uma conta. Palavras de
        categoria nova não aparecem aqui: elas ficam em `newCategories`.

        `added`, `skipped` e `rejected` cobrem, juntas, todas as palavras do
        `add` daquela entrada, depois da deduplicação silenciosa da repetição
        dentro do próprio item (§4.2, regra 10).
      properties:
        type: { $ref: "#/components/schemas/KeywordImportItemType" }
        id:
          type: string
          format: uuid
          description: |
            O id **como veio no JSON**, para a tela casar a linha do relatório
            com a linha do payload. É o único eco do conteúdo colado em toda a
            resposta, e é inofensivo: um uuid que o próprio cliente mandou não
            lhe ensina nada. Ecoado **só quando tem a forma canônica** de uuid;
            fora dela vem vazio (`""`) e a entrada é `item_not_found` — a
            posição na lista continua casando com a do payload. Texto que não
            é um uuid não é ecoado de volta para dentro do app.
        name:
          type: [string, "null"]
          maxLength: 123
          description: |
            O nome **exibível vindo do servidor**: o caminho completo
            `Grupo > Folha` quando `type` é `category`, o nome da conta quando é
            `account`. **Nunca** a string que o JSON mandou — é justamente essa
            diferença que faz `name_mismatch` significar alguma coisa, e é o que
            impede texto de IA de ser renderizado dentro do app.

            Nulo **exatamente** quando o item não foi resolvido na casa do token
            (`item_not_found`): aí não existe nome do servidor para mostrar.
        added:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Keyword" }
          description: O que entrou (confirm) ou entraria (prévia).
        skipped:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/KeywordImportSkippedKeyword" }
        rejected:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/KeywordImportRejectedKeyword" }
        impact: { $ref: "#/components/schemas/KeywordImportImpact" }

    KeywordImportTotals:
      type: object
      additionalProperties: false
      required: [categoriesCreated, added, skipped, rejected, periodTransactions]
      description: |
        Os números do topo da tela ("3 categorias novas · 18 palavras entram · 6
        já existiam · 3 recusadas"). **Confirmar** fica desabilitado quando
        `categoriesCreated` e `added` são ambos zero: não sobrou nada para
        aplicar.
      properties:
        categoriesCreated:
          type: integer
          minimum: 0
          description: |
            Folhas que nascem (prévia) ou nasceram (confirm) — `outcome:
            created`. `merged_into_existing` **não** conta: não houve criação.
        added: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        periodTransactions:
          type: integer
          minimum: 0
          description: |
            Lançamentos vivos `income`/`expense` da janela de trabalho — o
            **universo da medição** de `impact`, e o denominador da frase "87 de
            212" (§10.1 da spec 0010).

            Sem ele o limiar de atenção cairia para absoluto e a frase perderia
            o "de 212": pior, e evitável por um inteiro. Vem nas duas rotas,
            porque é a janela que o define, não a medição.

    KeywordImportReport:
      type: object
      additionalProperties: false
      required: [totals, newCategories, items]
      description: |
        O mesmo relatório nas duas rotas — no preview, o que **entraria**; no
        confirm, o que **de fato entrou**. A forma é idêntica de propósito: a
        tela desenha um bloco só, e a diferença entre conferir e aplicar não
        pode morar na estrutura da resposta.

        A única diferença de conteúdo é o `impact`, que só vem no preview e só
        em item de conta.
      properties:
        totals: { $ref: "#/components/schemas/KeywordImportTotals" }
        newCategories:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/KeywordImportNewCategory" }
        items:
          type: array
          maxItems: 400
          description: |
            Categorias e contas **que já existiam**, na ordem do JSON:
            `categoryKeywords` e depois `accountKeywords`. Teto de 400 porque as
            duas listas de entrada têm 200 cada.
          items: { $ref: "#/components/schemas/KeywordImportItem" }


security:
  - sessionCookie: []
